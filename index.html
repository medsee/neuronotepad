
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>NeurоNotepad</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#06080f"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="NeurоNote"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"/>
<meta name="description" content="Tibbiy dars konspektlari uchun aqlli bloknot"/>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#06080f;
  --surface:#0c1019;
  --surface2:#111827;
  --border:#1c2535;
  --border2:#253045;
  --accent:#7c6af7;
  --accent2:#5b8def;
  --accent3:#4ecba4;
  --text:#eef2f7;
  --text2:#8898b3;
  --text3:#3d4f6a;
  --danger:#e85050;
  --warn:#f0a04a;
  --r:12px;
  --r2:8px;
  --topbar:56px;
  --bottom-nav:60px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
input,textarea,select,button{font-family:inherit;font-size:inherit;color:inherit}
input::placeholder,textarea::placeholder{color:var(--text3)}
select option{background:var(--surface2)}
a{color:inherit;text-decoration:none}

/* ── TOPBAR ── */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:var(--topbar);
  background:rgba(6,8,15,0.92);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:10px;
}
.logo{
  font-family:'Instrument Serif',Georgia,serif;
  font-size:19px;font-style:italic;
  background:linear-gradient(135deg,#7c6af7,#5b8def);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  cursor:pointer;user-select:none;white-space:nowrap;flex-shrink:0;
}
.logo em{font-style:normal;font-size:11px;vertical-align:super;opacity:.7;-webkit-text-fill-color:#7c6af7}
.topbar-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.icon-btn{
  width:34px;height:34px;border-radius:var(--r2);border:1px solid var(--border);
  background:var(--surface);color:var(--text2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;
  transition:all .15s;
}
.icon-btn:active{background:var(--border);transform:scale(.94)}
.btn-primary{
  height:34px;padding:0 14px;border-radius:var(--r2);border:none;
  background:var(--accent);color:#fff;font-weight:600;font-size:13px;
  cursor:pointer;white-space:nowrap;transition:all .15s;display:flex;align-items:center;gap:5px;
}
.btn-primary:active{opacity:.82;transform:scale(.97)}
.btn-ghost{
  height:34px;padding:0 12px;border-radius:var(--r2);
  border:1px solid var(--border);background:transparent;
  color:var(--text2);font-size:13px;cursor:pointer;white-space:nowrap;
  transition:all .15s;display:flex;align-items:center;gap:5px;
}
.btn-ghost:active{background:var(--border)}

/* ── BOTTOM NAV (mobile) ── */
#bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  height:var(--bottom-nav);
  background:rgba(6,8,15,0.94);
  backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  display:none;align-items:center;justify-content:space-around;padding:0 4px;
}
.bnav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;
  gap:3px;padding:6px 4px;border:none;background:transparent;
  color:var(--text3);cursor:pointer;transition:color .15s;border-radius:var(--r2);
  font-size:10px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;
}
.bnav-btn .bicon{font-size:20px;line-height:1}
.bnav-btn.active{color:var(--accent)}

/* ── DESKTOP NAV ── */
#desktop-nav{display:flex;gap:2px;align-items:center}
.dnav-btn{
  height:32px;padding:0 12px;border-radius:var(--r2);border:none;
  background:transparent;color:var(--text2);font-size:13px;
  cursor:pointer;transition:all .15s;font-weight:500;
}
.dnav-btn.active{background:rgba(124,106,247,.15);color:#a394fa}

/* ── MAIN SCROLL ── */
#main{
  position:fixed;top:var(--topbar);bottom:0;left:0;right:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.view{padding:16px;max-width:900px;margin:0 auto;padding-bottom:20px}

/* ── CARDS ── */
.note-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.note-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:14px 15px;cursor:pointer;
  transition:all .18s;border-left:3px solid transparent;
  position:relative;overflow:hidden;
}
.note-card:active{transform:scale(.985)}
.note-card::before{
  content:'';position:absolute;top:0;right:0;
  width:60px;height:60px;border-radius:50%;
  background:radial-gradient(circle,var(--card-color,transparent) 0%,transparent 70%);
  opacity:.08;transform:translate(20px,-20px);pointer-events:none;
}
.note-title{
  font-size:15px;font-weight:600;color:var(--text);
  margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  padding-right:40px;
}
.note-preview{
  font-size:12px;color:var(--text2);line-height:1.65;margin-bottom:10px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.note-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{
  border-radius:6px;padding:2px 7px;font-size:11px;font-weight:500;
  display:inline-block;line-height:1.5;
}
.note-footer{font-size:10px;color:var(--text3);margin-top:8px;display:flex;gap:12px}
.card-pins{position:absolute;top:10px;right:10px;display:flex;gap:3px;font-size:13px}

/* ── SECTION TITLE ── */
.sec{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:1.2px;text-transform:uppercase;margin:18px 0 10px}

/* ── SEARCH BAR ── */
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.4;pointer-events:none}
.search-inp{
  width:100%;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:9px 12px 9px 38px;font-size:14px;color:var(--text);
  outline:none;transition:border .15s;
}
.search-inp:focus{border-color:var(--border2)}

/* ── FILTER ROW ── */
.filter-row{display:flex;gap:8px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.filter-select{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);
  padding:6px 10px;font-size:13px;color:var(--text);outline:none;cursor:pointer;
}
.color-dot{
  width:18px;height:18px;border-radius:50%;cursor:pointer;flex-shrink:0;
  border:2px solid transparent;transition:all .15s;
}
.color-dot.active{border-color:#fff;transform:scale(1.2)}
.sort-btn{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);
  padding:6px 10px;font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap;
}
.sort-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(124,106,247,.08)}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:60px 20px}
.empty-icon{font-size:48px;margin-bottom:14px}
.empty-title{font-size:18px;font-weight:600;color:var(--text2);margin-bottom:6px}
.empty-sub{font-size:13px;color:var(--text3);margin-bottom:20px}

/* ── EDITOR ── */
.editor-layout{display:grid;grid-template-columns:1fr 280px;gap:14px;min-height:calc(100vh - var(--topbar) - 60px)}
.editor-main{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);display:flex;flex-direction:column;
  border-left:3px solid var(--accent);min-height:400px;
}
.editor-toolbar{
  padding:10px 14px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
}
#e-title{
  flex:1;background:transparent;border:none;outline:none;
  font-size:17px;font-weight:600;color:var(--text);
  font-family:'Space Grotesk',system-ui,sans-serif;min-width:100px;
}
.editor-body{
  flex:1;display:flex;flex-direction:column;min-height:320px;
}
#e-content{
  flex:1;background:transparent;border:none;outline:none;
  padding:16px 18px;font-size:14px;color:var(--text2);
  font-family:'JetBrains Mono',monospace;line-height:1.85;
  resize:none;min-height:300px;
}
.editor-status{
  padding:6px 14px;border-top:1px solid var(--border);
  font-size:11px;color:var(--text3);display:flex;gap:14px;
}
.editor-imgs{
  padding:10px 14px;border-top:1px solid var(--border);
  display:flex;gap:8px;flex-wrap:wrap;
}
.img-thumb{
  width:72px;height:58px;border-radius:7px;object-fit:cover;
  border:1px solid var(--border);cursor:zoom-in;display:block;
}
.img-wrap{position:relative;flex-shrink:0}
.img-del{
  position:absolute;top:-5px;right:-5px;
  width:17px;height:17px;border-radius:50%;
  background:var(--danger);border:none;color:#fff;
  font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.side-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:14px;margin-bottom:10px;
}
.side-label{font-size:11px;color:var(--text3);margin-bottom:7px;display:block;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.inp{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r2);padding:7px 10px;font-size:13px;color:var(--text);outline:none;
  transition:border .15s;
}
.inp:focus{border-color:var(--border2)}
.check-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);cursor:pointer;margin-bottom:6px}
.check-row input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
.editor-side{overflow-y:auto}

/* ── DETAIL VIEW ── */
.detail-header{margin-bottom:18px}
.detail-title{font-size:22px;font-weight:700;margin-bottom:8px;line-height:1.3}
.detail-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap}
.detail-content{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:20px 22px;margin-bottom:16px;
  border-left:4px solid var(--accent);
}
.detail-content pre{
  font-family:'JetBrains Mono',monospace;font-size:13px;
  color:var(--text2);line-height:1.9;white-space:pre-wrap;word-break:break-word;margin:0;
}

/* ── FLASHCARDS ── */
.flash-wrap{max-width:560px;margin:0 auto;padding:10px 0}
.flash-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:36px 28px;text-align:center;
  cursor:pointer;min-height:220px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;user-select:none;
  transition:transform .1s;border-left:4px solid var(--accent);
}
.flash-card:active{transform:scale(.97)}
.flash-btns{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.flash-dots{display:flex;justify-content:center;gap:5px;margin-top:14px;flex-wrap:wrap}
.f-dot{width:7px;height:7px;border-radius:50%;cursor:pointer;transition:all .15s}

/* ── STATS ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:22px}
.stat-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:16px;text-align:center;
}
.stat-icon{font-size:20px;margin-bottom:8px}
.stat-val{font-size:24px;font-weight:700;color:var(--text)}
.stat-lbl{font-size:11px;color:var(--text3);margin-top:3px}
.prog-bar{height:5px;background:var(--border);border-radius:5px;overflow:hidden;margin-top:5px}
.prog-fill{height:100%;border-radius:5px;transition:width .5s}

/* ── MODAL ── */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;
  display:none;align-items:center;justify-content:center;padding:20px;
}
.overlay.open{display:flex}
.modal{
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:28px 24px;text-align:center;max-width:300px;width:100%;
}
.modal-icon{font-size:36px;margin-bottom:12px}
.modal-title{font-size:17px;font-weight:700;margin-bottom:8px}
.modal-sub{font-size:13px;color:var(--text2);margin-bottom:22px}
.modal-btns{display:flex;gap:10px;justify-content:center}

/* ── LIGHTBOX ── */
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
#lightbox.open{display:flex}
#lb-img{max-width:90vw;max-height:90vh;border-radius:10px;object-fit:contain}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:calc(var(--bottom-nav) + 12px);right:16px;
  border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;
  z-index:400;box-shadow:0 8px 24px rgba(0,0,0,.5);color:#fff;
  animation:toastIn .25s ease;pointer-events:none;
}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── MOBILE EDITOR ── */
.mobile-editor-tabs{
  display:none;
  position:sticky;top:0;z-index:10;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0 16px;
}
.mob-tab{
  background:transparent;border:none;color:var(--text2);
  padding:10px 14px;font-size:13px;font-weight:500;cursor:pointer;
  border-bottom:2px solid transparent;transition:all .15s;
}
.mob-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.mobile-side-panel{display:none}

/* ── RESPONSIVE ── */
@media(max-width:720px){
  :root{--topbar:52px}
  #desktop-nav{display:none}
  #bottom-nav{display:flex}
  #main{bottom:var(--bottom-nav)}
  .view{padding:12px;padding-bottom:10px}
  .note-grid{grid-template-columns:1fr}
  .editor-layout{grid-template-columns:1fr;gap:0;min-height:auto}
  .editor-side{display:none}
  .mobile-editor-tabs{display:flex}
  .mobile-side-panel{display:block}
  .editor-main{border-radius:0;border-left-width:3px;min-height:auto}
  .detail-title{font-size:18px}
  .flash-card{padding:24px 18px;min-height:180px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .topbar-actions .btn-ghost{display:none}
  .logo{font-size:17px}
  .toast{bottom:calc(var(--bottom-nav) + 10px);right:12px;left:12px;text-align:center}
  .filter-row{gap:6px}
  .filter-select{font-size:12px;padding:5px 8px}
}
@media(min-width:721px){
  .mobile-editor-tabs,.mobile-side-panel{display:none!important}
  .editor-side{display:block!important}
}

/* ── COLOR PICKER ── */
.color-pick-row{display:flex;gap:7px;flex-wrap:wrap}

/* ── SUBJECT TAG LIST ── */
.subj-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.subj-chip{
  padding:4px 10px;border-radius:20px;border:1px solid var(--border);
  font-size:11px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .15s;
}
.subj-chip:active{background:var(--border)}

/* ── RECENT LIST ── */
.recent-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--border);cursor:pointer;
}
.recent-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.recent-info{flex:1;overflow:hidden}
.recent-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent-sub{font-size:11px;color:var(--text3)}

/* ── PROGRESS ── */
.wpm-bar{
  height:3px;background:var(--border);border-radius:3px;
  margin-bottom:4px;overflow:hidden;
}
.wpm-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .4s}

/* ── AUTOSAVE INDICATOR ── */
#autosave-indicator{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:500;
  padding:3px 9px;border-radius:20px;
  transition:all .3s;user-select:none;
}
#autosave-indicator.idle{color:var(--text3);background:transparent}
#autosave-indicator.typing{color:var(--warn);background:rgba(240,160,74,.1)}
#autosave-indicator.saving{color:var(--accent2);background:rgba(91,141,239,.1)}
#autosave-indicator.saved{color:var(--accent3);background:rgba(78,203,164,.1)}
#autosave-indicator.error{color:var(--danger);background:rgba(232,80,80,.1)}
.as-dot{
  width:6px;height:6px;border-radius:50%;flex-shrink:0;transition:background .3s;
}
.idle .as-dot{background:var(--text3)}
.typing .as-dot{background:var(--warn);animation:pulse 1s infinite}
.saving .as-dot{background:var(--accent2);animation:spin-dot .6s linear infinite}
.saved .as-dot{background:var(--accent3)}
.error .as-dot{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin-dot{0%{transform:scale(1)}50%{transform:scale(1.6)}100%{transform:scale(1)}}

/* ── UNSAVED BADGE ── */
.unsaved-badge{
  display:none;width:8px;height:8px;border-radius:50%;
  background:var(--warn);position:absolute;top:8px;right:8px;
}
.unsaved-badge.show{display:block}
</style>
</head>
<body>

<!-- TOPBAR -->
<div id="topbar">
  <div class="logo" onclick="nav('home')">Neuro<em>N</em>otepad</div>
  <div id="desktop-nav">
    <button class="dnav-btn active" id="dn-home" onclick="nav('home')">🏠 Bosh sahifa</button>
    <button class="dnav-btn" id="dn-flashcards" onclick="nav('flashcards')">🃏 Flashcards</button>
    <button class="dnav-btn" id="dn-stats" onclick="nav('stats')">📊 Statistika</button>
  </div>
  <div class="topbar-actions">
    <button class="btn-ghost" onclick="exportData()" title="Eksport">⬇</button>
    <input type="file" accept=".json" id="import-file" style="display:none" onchange="importData(event)"/>
    <button class="btn-ghost" onclick="document.getElementById('import-file').click()" title="Import">⬆</button>
    <button class="btn-primary" onclick="newNote()"><span>+</span> Yangi</button>
  </div>
</div>

<!-- BOTTOM NAV (mobile) -->
<div id="bottom-nav">
  <button class="bnav-btn active" id="bn-home" onclick="nav('home')">
    <span class="bicon">🏠</span>Asosiy
  </button>
  <button class="bnav-btn" id="bn-flashcards" onclick="nav('flashcards')">
    <span class="bicon">🃏</span>Flash
  </button>
  <button class="bnav-btn" id="bn-new" onclick="newNote()">
    <span class="bicon" style="background:var(--accent);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;margin-bottom:1px">＋</span>
  </button>
  <button class="bnav-btn" id="bn-stats" onclick="nav('stats')">
    <span class="bicon">📊</span>Statistika
  </button>
  <button class="bnav-btn" id="bn-more" onclick="toggleMobileMenu()">
    <span class="bicon">⋯</span>Ko'proq
  </button>
</div>

<!-- MAIN CONTENT -->
<div id="main"></div>

<!-- DELETE MODAL -->
<div id="del-modal" class="overlay">
  <div class="modal">
    <div class="modal-icon">🗑</div>
    <div class="modal-title">O'chirishni tasdiqlang</div>
    <div class="modal-sub">Bu konspekt butunlay yo'qoladi.</div>
    <div class="modal-btns">
      <button class="btn-ghost" onclick="closeModal()">Bekor</button>
      <button class="btn-primary" style="background:var(--danger)" id="del-confirm">Ha, o'chir</button>
    </div>
  </div>
</div>

<!-- MOBILE MENU MODAL -->
<div id="mobile-menu" class="overlay">
  <div class="modal" style="max-width:260px">
    <div style="font-weight:700;margin-bottom:14px;font-size:15px">Menyu</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn-ghost" style="justify-content:flex-start;gap:10px;width:100%" onclick="exportData();closeMobileMenu()">⬇ Eksport qilish</button>
      <button class="btn-ghost" style="justify-content:flex-start;gap:10px;width:100%" onclick="document.getElementById('import-file').click();closeMobileMenu()">⬆ Import qilish</button>
      <button class="btn-ghost" style="justify-content:flex-start;gap:10px;width:100%;color:var(--text2)" onclick="closeMobileMenu()">✕ Yopish</button>
    </div>
  </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="this.classList.remove('open')">
  <img id="lb-img" src="" alt=""/>
</div>

<!-- TOAST -->
<div id="toast-el" class="toast" style="display:none"></div>

<script>
// ─── DATA ───
const SUBJECTS=['Anatomiya','Fiziologiya','Nevrologiya','Biokimyo','Farmakologiya','Patologiya','Mikrobiologiya','Immunologiya','Terapiya','Jarrohlik'];
const COLORS=['#7c6af7','#5b8def','#4ecba4','#f0a04a','#e85050','#d46ef5','#3bb8c0','#e878a0','#a3c44a','#6dd6e8'];

let notes=JSON.parse(localStorage.getItem('nn4_notes')||'[]');
let customSubjects=JSON.parse(localStorage.getItem('nn4_subj')||'[]');
let currentView='home';
let editingNote=null;
let flashIdx=0;
let flashFlipped=false;
let filterSubj='all';
let filterColor='all';
let sortBy='date';
let gridMode=true;
let searchQ='';
let mobileEditorTab='write'; // 'write' | 'settings'

// ─── AUTOSAVE STATE ───
let _autosaveTimer=null;
let _hasUnsaved=false;
const AUTOSAVE_DELAY=1200; // 1.2 soniya

function save(){
  try{
    localStorage.setItem('nn4_notes',JSON.stringify(notes));
    localStorage.setItem('nn4_subj',JSON.stringify(customSubjects));
    return true;
  }catch(e){
    // localStorage to'lgan bo'lishi mumkin
    console.warn('localStorage save error:',e);
    return false;
  }
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2);}
function allSubjects(){return[...SUBJECTS,...customSubjects];}
function wc(t){return(t||'').split(/\s+/).filter(Boolean).length;}
function fmtDate(ts){return new Date(ts).toLocaleDateString('uz-UZ',{day:'2-digit',month:'short',year:'numeric'});}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function isMobile(){return window.innerWidth<=720;}

// ─── AUTOSAVE INDICATOR ───
function setAutoSaveStatus(status){
  const el=document.getElementById('autosave-indicator');
  if(!el)return;
  const labels={idle:'',typing:'Yozilmoqda...',saving:'Saqlanmoqda...',saved:'Saqlandi ✓',error:'Xato!'};
  el.className='';el.classList.add(status);
  el.innerHTML=`<span class="as-dot"></span><span>${labels[status]}</span>`;
}

// Debounced avto-saqlash — foydalanuvchi to'xtaganida 1.2s keyin saqlanadi
function triggerAutosave(){
  _hasUnsaved=true;
  setAutoSaveStatus('typing');
  clearTimeout(_autosaveTimer);
  _autosaveTimer=setTimeout(()=>{
    if(!editingNote||!_hasUnsaved)return;
    setAutoSaveStatus('saving');
    editingNote.updatedAt=Date.now();
    const idx=notes.findIndex(x=>x.id===editingNote.id);
    if(idx>=0)notes[idx]={...editingNote};
    const ok=save();
    _hasUnsaved=false;
    setAutoSaveStatus(ok?'saved':'error');
    if(!ok)toast('Saqlashda xato — xotira to\'lgan bo\'lishi mumkin','err');
    // 3 soniyadan keyin "idle" ga qaytadi
    setTimeout(()=>setAutoSaveStatus('idle'),3000);
  },AUTOSAVE_DELAY);
}

// Sahifa yopilishda ogohlantirish
window.addEventListener('beforeunload',e=>{
  if(_hasUnsaved&&currentView==='editor'){
    e.preventDefault();
    e.returnValue='Saqlanmagan o\'zgarishlar bor. Chiqishni xohlaysizmi?';
    return e.returnValue;
  }
});

// ─── TOAST ───
function toast(msg,type){
  const el=document.getElementById('toast-el');
  el.textContent=msg;
  el.style.background=type==='err'?'var(--danger)':type==='warn'?'var(--warn)':'#10b981';
  el.style.display='block';clearTimeout(window._tt);
  window._tt=setTimeout(()=>el.style.display='none',2800);
}

// ─── NAV ───
function nav(v,noteId){
  currentView=v;
  // desktop nav
  document.querySelectorAll('.dnav-btn').forEach(b=>b.classList.remove('active'));
  const dn=document.getElementById('dn-'+v);if(dn)dn.classList.add('active');
  // bottom nav
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('active'));
  const bn=document.getElementById('bn-'+v);if(bn)bn.classList.add('active');

  if(v==='home')renderHome();
  else if(v==='editor'&&editingNote)renderEditor();
  else if(v==='detail'&&noteId)renderDetail(noteId);
  else if(v==='flashcards')renderFlashcards();
  else if(v==='stats')renderStats();
  document.getElementById('main').scrollTop=0;
}

// ─── NOTE CRUD ───
function newNote(){
  const n={
    id:uid(),title:'',content:'',subject:allSubjects()[0],
    color:COLORS[0],images:[],tags:[],
    pinned:false,starred:false,
    createdAt:Date.now(),updatedAt:Date.now()
  };
  notes.unshift(n);save();
  editingNote={...n};
  mobileEditorTab='write';
  nav('editor');
}

function saveNote(){
  if(!editingNote)return;
  clearTimeout(_autosaveTimer);
  setAutoSaveStatus('saving');
  editingNote.updatedAt=Date.now();
  const idx=notes.findIndex(x=>x.id===editingNote.id);
  if(idx>=0)notes[idx]={...editingNote};
  const ok=save();
  _hasUnsaved=false;
  setAutoSaveStatus(ok?'saved':'error');
  if(ok)toast('Saqlandi ✓');
  else toast('Saqlashda xato!','err');
  setTimeout(()=>setAutoSaveStatus('idle'),3000);
  refreshEditorLeft();
}

function deleteNote(id){
  notes=notes.filter(x=>x.id!==id);save();
  closeModal();nav('home');toast('O\'chirildi','err');
}

function togglePin(id){const n=notes.find(x=>x.id===id);if(n){n.pinned=!n.pinned;save();}}
function toggleStar(id){const n=notes.find(x=>x.id===id);if(n){n.starred=!n.starred;save();}}

function duplicateNote(n){
  const c={...n,id:uid(),title:(n.title||'Nomsiz')+' (nusxa)',createdAt:Date.now(),updatedAt:Date.now(),pinned:false,images:[...(n.images||[])],tags:[...(n.tags||[])]};
  notes.unshift(c);save();toast('Nusxa yaratildi 📋');
}

// ─── MODAL ───
function showModal(id){
  document.getElementById('del-modal').classList.add('open');
  document.getElementById('del-confirm').onclick=()=>deleteNote(id);
}
function closeModal(){document.getElementById('del-modal').classList.remove('open');}
function toggleMobileMenu(){document.getElementById('mobile-menu').classList.add('open');}
function closeMobileMenu(){document.getElementById('mobile-menu').classList.remove('open');}
function showLightbox(src){document.getElementById('lb-img').src=src;document.getElementById('lightbox').classList.add('open');}

// ─── FILTER ───
function getFiltered(){
  return notes.filter(n=>{
    const q=searchQ.toLowerCase();
    const ms=!q||[n.title,n.content,n.subject,...(n.tags||[])].some(t=>(t||'').toLowerCase().includes(q));
    const mj=filterSubj==='all'||n.subject===filterSubj;
    const mc=filterColor==='all'||n.color===filterColor;
    return ms&&mj&&mc;
  }).sort((a,b)=>{
    if(a.pinned!==b.pinned)return a.pinned?-1:1;
    if(sortBy==='date')return b.updatedAt-a.updatedAt;
    if(sortBy==='title')return(a.title||'').localeCompare(b.title||'');
    if(sortBy==='words')return wc(b.content)-wc(a.content);
    return 0;
  });
}

// ─── NOTE CARD ───
function renderNoteCard(n){
  return`<div class="note-card" style="--card-color:${n.color};border-left-color:${n.color}" onclick="nav('detail','${n.id}')">
    <div class="card-pins">${n.pinned?'📌':''}${n.starred?'⭐':''}</div>
    <div class="note-title">${esc(n.title)||'Nomsiz'}</div>
    <div class="note-preview">${esc(n.content)||'Kontent yo\'q...'}</div>
    <div class="note-meta">
      <span class="tag" style="background:${n.color}22;color:${n.color}">${esc(n.subject)}</span>
      ${(n.images||[]).length>0?`<span class="tag" style="background:#ffffff0a;color:var(--text3)">📸 ${n.images.length}</span>`:''}
      ${(n.tags||[]).slice(0,2).map(t=>`<span class="tag" style="background:#ffffff08;color:var(--text3)">#${esc(t)}</span>`).join('')}
    </div>
    <div class="note-footer"><span>${fmtDate(n.updatedAt)}</span><span>${wc(n.content)} so'z</span></div>
  </div>`;
}

// ─── HOME ───
function renderHome(){
  const filtered=getFiltered();
  const pinned=filtered.filter(n=>n.pinned);
  const starred=filtered.filter(n=>n.starred&&!n.pinned);
  const rest=filtered.filter(n=>!n.pinned&&(!n.starred||searchQ||filterSubj!=='all'||filterColor!=='all'));
  const subs=allSubjects();

  const sortBtns=['date','title','words'].map(s=>
    `<button class="sort-btn ${sortBy===s?'active':''}" onclick="sortBy='${s}';renderHome()">${s==='date'?'Sana':s==='title'?'Sarlavha':'So\'zlar'}</button>`
  ).join('');

  document.getElementById('main').innerHTML=`<div class="view">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-inp" placeholder="Qidirish — mavzu, teg, matn..." value="${esc(searchQ)}" oninput="searchQ=this.value;renderHome()"/>
    </div>
    <div class="filter-row">
      <select class="filter-select" onchange="filterSubj=this.value;renderHome()">
        <option value="all">Barcha fanlar</option>
        ${subs.map(s=>`<option value="${esc(s)}" ${filterSubj===s?'selected':''}>${esc(s)}</option>`).join('')}
      </select>
      <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">
        ${COLORS.map(c=>`<div class="color-dot ${filterColor===c?'active':''}" style="background:${c}" onclick="filterColor=filterColor==='${c}'?'all':'${c}';renderHome()"></div>`).join('')}
      </div>
    </div>
    <div class="filter-row" style="margin-bottom:18px;gap:5px">
      ${sortBtns}
      <button class="sort-btn" onclick="gridMode=!gridMode;renderHome()">${gridMode?'☰ Liste':'⊞ Grid'}</button>
    </div>

    ${notes.length===0?`<div class="empty">
      <div class="empty-icon">📓</div>
      <div class="empty-title">Hali konspekt yo'q</div>
      <div class="empty-sub">Birinchi konspektingizni yarating</div>
      <button class="btn-primary" onclick="newNote()">📝 Konspekt yaratish</button>
    </div>`:''}

    ${notes.length>0&&filtered.length===0?`<div class="empty" style="padding:40px">
      <div class="empty-icon" style="font-size:36px">🔍</div>
      <div class="empty-title">Natija topilmadi</div>
      <div class="empty-sub">"${esc(searchQ)}" so'rovi bo'yicha hech narsa yo'q</div>
    </div>`:''}

    ${pinned.length>0?`<div class="sec">📌 Pinlangan (${pinned.length})</div><div class="${gridMode?'note-grid':'note-grid'}" style="${gridMode?'':'grid-template-columns:1fr'}">${pinned.map(renderNoteCard).join('')}</div>`:''}
    ${starred.length>0&&!searchQ&&filterSubj==='all'&&filterColor==='all'?`<div class="sec">⭐ Sevimlilar (${starred.length})</div><div class="note-grid" style="${gridMode?'':'grid-template-columns:1fr'}">${starred.map(renderNoteCard).join('')}</div>`:''}
    ${rest.length>0?`<div class="sec">📚 Konspektlar (${rest.length})</div><div class="note-grid" style="${gridMode?'':'grid-template-columns:1fr'}">${rest.map(renderNoteCard).join('')}</div>`:''}
  </div>`;
}

// ─── EDITOR ───
function renderEditor(){
  if(!editingNote)return;
  const n=editingNote;
  const mobile=isMobile();

  document.getElementById('main').innerHTML=`
  ${mobile?`<div class="mobile-editor-tabs">
    <button class="mob-tab ${mobileEditorTab==='write'?'active':''}" onclick="mobileEditorTab='write';refreshMobTab()">✏️ Yozish</button>
    <button class="mob-tab ${mobileEditorTab==='settings'?'active':''}" onclick="mobileEditorTab='settings';refreshMobTab()">⚙️ Sozlamalar</button>
  </div>`:''}
  <div class="view" style="padding-bottom:${mobile?'80px':'20px'}">
    <div class="editor-toolbar" style="background:var(--surface);border-radius:var(--r) var(--r) 0 0;border:1px solid var(--border);border-bottom:none;margin-bottom:0">
      <button class="btn-ghost" onclick="if(_hasUnsaved){if(!confirm('Saqlanmagan o\\'zgarishlar bor. Chiqasizmi?'))return;_hasUnsaved=false;clearTimeout(_autosaveTimer);}saveNote();nav('home')" style="flex-shrink:0">← Orqaga</button>
      <input id="e-title" placeholder="Mavzu sarlavhasi..." value="${esc(n.title)}" oninput="editingNote.title=this.value;triggerAutosave()"/>
      <span id="autosave-indicator" class="idle"><span class="as-dot"></span><span></span></span>
      <button class="btn-primary" style="background:${n.color};flex-shrink:0" onclick="saveNote()">💾 Saqlash</button>
      <button class="icon-btn" onclick="showModal('${n.id}')" style="color:var(--danger);border-color:var(--danger)44;flex-shrink:0">🗑</button>
    </div>
    <div class="editor-layout" id="editor-layout">
      <div class="editor-main" id="editor-main-panel" style="border-left-color:${n.color};border-radius:0 0 var(--r) var(--r);${mobile&&mobileEditorTab!=='write'?'display:none':''}">
        <div class="editor-body">
          <textarea id="e-content" placeholder="Dars konspektini yozing...\n\n• Asosiy tushunchalar\n• Formulalar va ta'riflar\n• Eslatmalar\n\nCtrl+S — saqlash"
            oninput="editingNote.content=this.value;updateStats();triggerAutosave()">${esc(n.content)}</textarea>
        </div>
        <div class="editor-status" id="e-stats">
          <span>📝 ${wc(n.content)} so'z</span>
          <span>🔤 ${(n.content||'').length} belgi</span>
          <span>📄 ${(n.content||'').split('\n').length} qator</span>
        </div>
        ${(n.images||[]).length>0?`<div class="editor-imgs" id="e-imgs">${renderImgThumbs(n.images)}</div>`:'<div id="e-imgs"></div>'}
      </div>
      <div class="editor-side" id="editor-side-panel" style="${mobile&&mobileEditorTab!=='settings'?'display:none':''}">
        ${renderEditorSide(n)}
      </div>
      <div class="mobile-side-panel" id="mobile-side-panel" style="${mobile&&mobileEditorTab==='settings'?'':'display:none'}">
        ${renderEditorSide(n)}
      </div>
    </div>
  </div>`;

  const ta=document.getElementById('e-content');
  if(ta){
    ta.addEventListener('keydown',e=>{
      if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveNote();}
    });
    if(mobile&&mobileEditorTab==='write'){ta.focus();}
  }
  // Indikatorni boshlang'ich holatga keltir
  _hasUnsaved=false;
  clearTimeout(_autosaveTimer);
  setAutoSaveStatus('idle');
  // Storage metrni yangilash
  setTimeout(updateStorageMeter,50);
}

function renderEditorSide(n){
  const subs=allSubjects();
  return`
  <div class="side-card">
    <span class="side-label">📚 Fan</span>
    <select class="inp" id="e-subj" style="margin-bottom:8px" onchange="editingNote.subject=this.value;triggerAutosave()">
      ${subs.map(s=>`<option value="${esc(s)}" ${n.subject===s?'selected':''}>${esc(s)}</option>`).join('')}
    </select>
    <div id="add-subj-area">
      <button class="btn-ghost" style="font-size:12px;width:100%;justify-content:center" onclick="showAddSubj()">+ Yangi fan</button>
    </div>
  </div>
  <div class="side-card">
    <span class="side-label">🎨 Rang</span>
    <div class="color-pick-row" id="color-row">
      ${COLORS.map(c=>`<div class="color-dot ${n.color===c?'active':''}" style="background:${c}" onclick="pickColor('${c}')"></div>`).join('')}
    </div>
  </div>
  <div class="side-card">
    <span class="side-label">🏷 Teglar <small style="color:var(--text3);text-transform:none;letter-spacing:0">(Enter)</small></span>
    <input class="inp" id="tag-inp" placeholder="Teg qo'shish..." style="margin-bottom:8px" onkeydown="onTagKey(event)"/>
    <div id="tags-wrap" style="display:flex;gap:5px;flex-wrap:wrap">
      ${(n.tags||[]).map(t=>`<span class="tag" style="background:${n.color}22;color:${n.color};cursor:pointer" onclick="removeTag('${esc(t)}')">#${esc(t)} ×</span>`).join('')}
    </div>
  </div>
  <div class="side-card">
    <span class="side-label">📸 Rasmlar</span>
    <input type="file" id="img-inp" accept="image/*" multiple style="display:none" onchange="addImages(event)"/>
    <button class="btn-primary" style="background:${n.color};width:100%;justify-content:center" onclick="document.getElementById('img-inp').click()">📷 Rasm yuklash</button>
    <p style="font-size:11px;color:var(--text3);margin-top:6px;text-align:center">Avtomatik siqiladi • max 350KB/rasm</p>
    <div id="storage-meter" style="margin-top:10px"></div>
  </div>
  <div class="side-card">
    <span class="side-label">⚙️ Opsiyalar</span>
    <label class="check-row"><input type="checkbox" ${n.pinned?'checked':''} onchange="editingNote.pinned=this.checked;triggerAutosave()"/> 📌 Yuqoriga pin</label>
    <label class="check-row"><input type="checkbox" ${n.starred?'checked':''} onchange="editingNote.starred=this.checked;triggerAutosave()"/> ⭐ Sevimlilar</label>
  </div>
  <div style="font-size:11px;color:var(--text3);text-align:center;padding:4px 0 8px">
    Yaratilgan: ${fmtDate(n.createdAt)}<br/>Tahrirlangan: ${fmtDate(n.updatedAt)}
  </div>`;
}

function renderImgThumbs(imgs){
  return imgs.map(img=>{
    const sizeInfo=img.newKB?`${img.newKB}KB`:'';
    const savedInfo=img.origKB&&img.newKB&&img.origKB>img.newKB
      ?` <span style="color:var(--accent3)">-${Math.round((1-img.newKB/img.origKB)*100)}%</span>`:'';
    return`<div class="img-wrap" title="${esc(img.name)}${img.origKB?' ('+img.origKB+'KB → '+img.newKB+'KB)':''}">
      <img src="${img.url}" class="img-thumb" onclick="showLightbox('${img.url}')"/>
      <button class="img-del" onclick="removeImg('${img.id}')">×</button>
      ${sizeInfo?`<div style="position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.65);border-radius:3px;padding:1px 4px;font-size:9px;color:#fff;pointer-events:none">${sizeInfo}${savedInfo}</div>`:''}
    </div>`;
  }).join('');
}

function refreshMobTab(){
  renderEditor();
}

function refreshEditorLeft(){
  const n=editingNote;
  const stats=document.getElementById('e-stats');
  if(stats){
    stats.innerHTML=`<span>📝 ${wc(n.content)} so'z</span><span>🔤 ${(n.content||'').length} belgi</span><span>📄 ${(n.content||'').split('\n').length} qator</span>`;
  }
}

function updateStats(){
  refreshEditorLeft();
}

function pickColor(c){
  editingNote.color=c;
  document.querySelectorAll('.color-dot').forEach(d=>d.classList.toggle('active',d.style.background===c));
  const em=document.getElementById('editor-main-panel');
  if(em)em.style.borderLeftColor=c;
  document.querySelectorAll('[onclick*="img-inp"]').forEach(b=>b.style.background=c);
  triggerAutosave();
}

function onTagKey(e){
  if((e.key==='Enter'||e.key===',')&&e.target.value.trim()){
    e.preventDefault();
    const t=e.target.value.trim();
    editingNote.tags=[...new Set([...(editingNote.tags||[]),t])];
    e.target.value='';
    refreshTags();
    triggerAutosave();
  }
}
function refreshTags(){
  const n=editingNote;
  const w=document.getElementById('tags-wrap');
  if(w)w.innerHTML=(n.tags||[]).map(t=>`<span class="tag" style="background:${n.color}22;color:${n.color};cursor:pointer" onclick="removeTag('${esc(t)}')">#${esc(t)} ×</span>`).join('');
}
function removeTag(t){
  editingNote.tags=(editingNote.tags||[]).filter(x=>x!==t);
  refreshTags();
  triggerAutosave();
}

function showAddSubj(){
  const a=document.getElementById('add-subj-area');
  if(a)a.innerHTML=`<div style="display:flex;gap:6px"><input class="inp" id="new-subj" placeholder="Fan nomi..." style="flex:1;font-size:12px"/><button class="btn-primary" onclick="addSubj()">+</button></div>`;
}
function addSubj(){
  const inp=document.getElementById('new-subj');
  if(!inp||!inp.value.trim())return;
  const s=inp.value.trim();
  if(!customSubjects.includes(s)){customSubjects.push(s);save();}
  editingNote.subject=s;
  renderEditor();
}

// ─── IMAGE COMPRESSION ───
const IMG_MAX_W=1280;   // max kenglik px
const IMG_MAX_H=1280;   // max balandlik px
const IMG_QUALITY=0.72; // JPEG sifati (0–1)
const IMG_MAX_KB=350;   // bitta rasm uchun maksimal KB
const STORAGE_MAX=4.5*1024*1024; // 4.5MB — xavfsiz limit

function getStorageUsedBytes(){
  let total=0;
  try{for(const k in localStorage)if(Object.prototype.hasOwnProperty.call(localStorage,k))total+=localStorage[k].length*2;}catch{}
  return total;
}
function fmtKB(bytes){
  if(bytes<1024)return bytes+'B';
  if(bytes<1024*1024)return Math.round(bytes/1024)+'KB';
  return(bytes/1024/1024).toFixed(1)+'MB';
}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=ev=>{
      const img=new Image();
      img.onerror=reject;
      img.onload=()=>{
        let {width:w,height:h}=img;
        // O'lchamni kamaytir
        const ratio=Math.min(1,IMG_MAX_W/w,IMG_MAX_H/h);
        w=Math.round(w*ratio);h=Math.round(h*ratio);

        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);

        // Avval JPEG bilan siqib ko'r, kerak bo'lsa sifatni pasayt
        let quality=IMG_QUALITY;
        let dataUrl=canvas.toDataURL('image/jpeg',quality);

        // Agar hali ham katta bo'lsa, sifatni pasaytir
        while(dataUrl.length*0.75>IMG_MAX_KB*1024&&quality>0.3){
          quality-=0.1;
          dataUrl=canvas.toDataURL('image/jpeg',quality);
        }

        const origKB=Math.round(file.size/1024);
        const newKB=Math.round(dataUrl.length*0.75/1024);
        resolve({dataUrl,origKB,newKB,w,h});
      };
      img.src=ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function updateStorageMeter(){
  const el=document.getElementById('storage-meter');
  if(!el)return;
  const used=getStorageUsedBytes();
  const pct=Math.min(100,Math.round((used/STORAGE_MAX)*100));
  const color=pct>85?'var(--danger)':pct>65?'var(--warn)':'var(--accent3)';
  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-bottom:4px">
      <span>💾 Xotira</span>
      <span style="color:${color}">${fmtKB(used)} / ${fmtKB(STORAGE_MAX)} (${pct}%)</span>
    </div>
    <div style="height:4px;background:var(--border);border-radius:4px;overflow:hidden">
      <div style="height:100%;width:${pct}%;background:${color};border-radius:4px;transition:width .4s"></div>
    </div>
    ${pct>85?`<div style="font-size:10px;color:var(--danger);margin-top:4px">⚠ Xotira deyarli to'ldi! Ba'zi rasmlarni o'chiring.</div>`:''}
  `;
}

async function addImages(e){
  const files=Array.from(e.target.files);
  if(!files.length)return;

  // Yuklanish ko'rsatkichi
  const imgWrap=document.getElementById('e-imgs');
  const loadId='img-loading-'+uid();
  if(imgWrap){
    const loader=document.createElement('div');
    loader.id=loadId;
    loader.style.cssText='display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);padding:4px 0';
    loader.innerHTML=`<span style="animation:pulse 1s infinite;display:inline-block">⏳</span> ${files.length} ta rasm siqilmoqda...`;
    imgWrap.appendChild(loader);
  }

  const results=[];
  for(const file of files){
    // Storage limitini tekshir
    const usedNow=getStorageUsedBytes();
    if(usedNow>STORAGE_MAX*0.92){
      toast('Xotira to\'ldi! Avval ba\'zi rasmlarni o\'chiring.','err');
      break;
    }
    try{
      const {dataUrl,origKB,newKB,w,h}=await compressImage(file);
      const img={id:uid(),url:dataUrl,name:file.name,ts:Date.now(),origKB,newKB,w,h};
      editingNote.images=[...(editingNote.images||[]),img];
      results.push({name:file.name,origKB,newKB});
    }catch(err){
      toast(`"${file.name}" yuklashda xato`,'err');
    }
  }

  refreshImgs();
  triggerAutosave();
  updateStorageMeter();

  // Natija xabar
  if(results.length){
    const saved=results.reduce((a,r)=>a+(r.origKB-r.newKB),0);
    const msg=results.length===1
      ?`📸 ${results[0].origKB}KB → ${results[0].newKB}KB (${Math.round((1-results[0].newKB/results[0].origKB)*100)}% tejandi)`
      :`📸 ${results.length} rasm yuklandi · ${saved}KB tejandi`;
    toast(msg);
  }
}

function removeImg(id){
  editingNote.images=(editingNote.images||[]).filter(i=>i.id!==id);
  refreshImgs();
  triggerAutosave();
  updateStorageMeter();
}
function refreshImgs(){
  const w=document.getElementById('e-imgs');
  if(!w)return;
  const imgs=editingNote.images||[];
  if(imgs.length>0){
    w.style.display='flex';
    w.innerHTML=renderImgThumbs(imgs);
  }else{w.innerHTML='';}
}

// ─── FLASHCARDS ───
function renderFlashcards(){
  const deck=notes.filter(n=>n.title&&n.content);
  if(deck.length===0){
    document.getElementById('main').innerHTML=`<div class="view">
      <div class="empty">
        <div class="empty-icon">🃏</div>
        <div class="empty-title">Flashcard uchun konspekt kerak</div>
        <div class="empty-sub">Sarlavha va kontent bor konspekt yarating</div>
        <button class="btn-primary" onclick="newNote()">+ Konspekt yaratish</button>
      </div>
    </div>`;
    return;
  }
  const idx=((flashIdx%deck.length)+deck.length)%deck.length;
  const n=deck[idx];
  const total=deck.length;
  const pct=Math.round(((idx+1)/total)*100);

  document.getElementById('main').innerHTML=`<div class="view">
    <div class="flash-wrap">
      <div style="text-align:center;margin-bottom:14px">
        <div style="font-size:13px;color:var(--text2);font-weight:600">${idx+1} / ${total}</div>
        <div class="wpm-bar" style="margin-top:6px"><div class="wpm-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="flash-card" style="border-left-color:${n.color}" onclick="flashFlipped=!flashFlipped;renderFlashcards()">
        ${!flashFlipped?`
          <div style="font-size:12px;color:${n.color};font-weight:600;letter-spacing:.8px;margin-bottom:10px;text-transform:uppercase">${esc(n.subject)}</div>
          <div style="font-family:'Instrument Serif',Georgia,serif;font-size:22px;font-style:italic;color:var(--text);margin-bottom:14px;line-height:1.3">${esc(n.title)}</div>
          ${(n.tags||[]).length?`<div style="display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:12px">${(n.tags||[]).slice(0,3).map(t=>`<span class="tag" style="background:${n.color}22;color:${n.color}">#${esc(t)}</span>`).join('')}</div>`:''}
          <div style="font-size:12px;color:var(--text3);margin-top:6px">👆 Bosib javobni ko'ring</div>
        `:`
          <div style="font-size:11px;color:${n.color};font-weight:700;letter-spacing:1px;margin-bottom:14px;text-transform:uppercase">Javob</div>
          <div style="font-size:13px;color:var(--text2);line-height:1.85;text-align:left;max-width:100%">${esc(n.content.slice(0,350)+(n.content.length>350?'...':''))}</div>
        `}
      </div>
      <div class="flash-btns">
        <button class="btn-ghost" onclick="flashFlipped=false;flashIdx=${(idx-1+total)%total};renderFlashcards()">← Oldingi</button>
        <button class="btn-ghost" style="color:var(--accent2)" onclick="flashFlipped=false;flashIdx=Math.floor(Math.random()*${total});renderFlashcards()">🔀 Tasodifiy</button>
        <button class="btn-primary" style="background:${n.color}" onclick="flashFlipped=false;flashIdx=${(idx+1)%total};renderFlashcards()">Keyingi →</button>
      </div>
      <div class="flash-dots">
        ${Array.from({length:Math.min(total,20)},(_,i)=>`<div class="f-dot" style="background:${i===idx?'var(--accent)':'var(--border)'}" onclick="flashIdx=${i};flashFlipped=false;renderFlashcards()"></div>`).join('')}
        ${total>20?`<div style="font-size:11px;color:var(--text3)">+${total-20}</div>`:''}
      </div>
    </div>
  </div>`;
}

// ─── STATS ───
function renderStats(){
  const subs=allSubjects().map(s=>({s,c:notes.filter(n=>n.subject===s).length})).filter(x=>x.c>0).sort((a,b)=>b.c-a.c);
  const recent=[...notes].sort((a,b)=>b.updatedAt-a.updatedAt).slice(0,5);
  const totalImg=notes.reduce((a,n)=>a+(n.images||[]).length,0);
  const totalW=notes.reduce((a,n)=>a+wc(n.content),0);

  document.getElementById('main').innerHTML=`<div class="view">
    <div style="font-family:'Instrument Serif',Georgia,serif;font-size:24px;font-style:italic;margin-bottom:20px;color:var(--text)">Statistika</div>
    <div class="stat-grid">
      ${[['📓',notes.length,'Jami konspekt'],['📸',totalImg,'Rasmlar'],['📝',totalW,'Jami so\'z'],['⭐',notes.filter(n=>n.starred).length,'Sevimlilar'],['📌',notes.filter(n=>n.pinned).length,'Pinlangan'],['📚',subs.length,'Fanlar']].map(([ic,v,l])=>`
      <div class="stat-card">
        <div class="stat-icon">${ic}</div>
        <div class="stat-val">${v}</div>
        <div class="stat-lbl">${l}</div>
      </div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px">
        <div class="sec" style="margin-top:0">Fanlar bo'yicha</div>
        ${subs.length===0?`<div style="color:var(--text3);font-size:13px">Ma'lumot yo'q</div>`:subs.map(({s,c},i)=>{
          const col=COLORS[i%COLORS.length];
          const pct=Math.round((c/notes.length)*100);
          return`<div style="margin-bottom:12px">
            <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">

        ${recent.length===0?`<div style="color:var(--text3);font-size:13px">Hali konspekt yo'q</div>`:recent.map(n=>`
        <div class="recent-item" onclick="nav('detail','${n.id}')">
          <div class="recent-dot" style="background:${n.color}"></div>

            <div class="recent-title">${esc(n.title)||'Nomsiz'}</div>
            <div class="recent-sub">${esc(n.subject)} · ${fmtDate(n.updatedAt)}</div>
          </div>
        </div>`).join('')}
      </div>
    </div>
  </div>`;
}

// ─── EXPORT / IMPORT ───
function exportData(){
  const blob=new Blob([JSON.stringify({notes,customSubjects},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='neuronotepad_backup.json';a.click();
  toast('Eksport qilindi ⬇');
}
function importData(e){
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(Array.isArray(d.notes)){
        notes=[...d.notes,...notes];
        if(d.customSubjects)customSubjects=[...new Set([...customSubjects,...d.customSubjects])];
        save();toast(d.notes.length+' ta konspekt yuklandi ⬆');renderHome();
      }else if(Array.isArray(d)){
        notes=[...d,...notes];save();toast(d.length+' ta yuklandi ⬆');renderHome();
      }else{toast('Format noto\'g\'ri','err');}
    }catch{toast('Fayl o\'qishda xato!','err');}
  };
  r.readAsText(file);e.target.value='';
}

// ─── PWA: SERVICE WORKER ───
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js')
      .then(reg=>{
        console.log('SW registered:', reg.scope);
        // Yangi versiya kelsa — foydalanuvchiga xabar
        reg.addEventListener('updatefound',()=>{
          const newSW=reg.installing;
          newSW.addEventListener('statechange',()=>{
            if(newSW.state==='installed'&&navigator.serviceWorker.controller){
              showUpdateBanner();
            }
          });
        });
      })
      .catch(err=>console.log('SW error:',err));
  });
}

// ─── PWA: A2HS (Add to Home Screen) ───
let _deferredInstallPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  _deferredInstallPrompt=e;
  // 3 soniyadan keyin install bannerini ko'rsat
  setTimeout(showInstallBanner,3000);
});

window.addEventListener('appinstalled',()=>{
  _deferredInstallPrompt=null;
  hideInstallBanner();
  toast('Ilova o\'rnatildi! 🎉');
});

function showInstallBanner(){
  if(!_deferredInstallPrompt)return;
  const b=document.getElementById('install-banner');
  if(b)b.style.display='flex';
}
function hideInstallBanner(){
  const b=document.getElementById('install-banner');
  if(b)b.style.display='none';
  _deferredInstallPrompt=null;
}
async function triggerInstall(){
  if(!_deferredInstallPrompt)return;
  _deferredInstallPrompt.prompt();
  const {outcome}=await _deferredInstallPrompt.userChoice;
  if(outcome==='accepted')toast('O\'rnatilmoqda... ⬇');
  hideInstallBanner();
}

function showUpdateBanner(){
  const b=document.getElementById('update-banner');
  if(b)b.style.display='flex';
}
function applyUpdate(){
  if(navigator.serviceWorker.controller){
    navigator.serviceWorker.controller.postMessage('skipWaiting');
  }
  window.location.reload();
}

// ─── OFFLINE / ONLINE STATUS ───
function updateNetworkStatus(){
  const el=document.getElementById('network-status');
  if(!el)return;
  if(navigator.onLine){
    el.style.display='none';
  }else{
    el.style.display='flex';
  }
}
window.addEventListener('online',()=>{updateNetworkStatus();toast('Internet tiklandi 🌐');});
window.addEventListener('offline',()=>{updateNetworkStatus();toast('Offline rejim — ma\'lumotlar saqlanadi','warn');});

// ─── URL SHORTCUT: ?action=new ───
if(location.search.includes('action=new')){
  setTimeout(newNote,300);
  history.replaceState(null,'',location.pathname);
}

// ─── INIT ───
renderHome();
updateNetworkStatus();
</script>
