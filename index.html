<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>NeurоNotepad</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#060810;--surface:#0c1018;--card:#111620;--border:#1c2535;--border2:#253045;
  --accent:#5b8dee;--accent2:#7c5cbf;--green:#22c97a;--amber:#f0a500;--red:#e05555;--pink:#d966a8;
  --text:#dce6f5;--muted:#6a7f9a;--dim:#2d3f58;
  --r:14px;--rs:8px;
  --font:'Space Grotesk',system-ui,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;font-size:14px;line-height:1.6}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--dim);border-radius:2px}
input,textarea,select{font-family:var(--font)}
input::placeholder,textarea::placeholder{color:var(--dim)}
select option{background:#111620}
button{font-family:var(--font);cursor:pointer;transition:opacity .15s,transform .1s}
button:active{transform:scale(.97)}

#topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:54px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200}
.logo{font-family:'Instrument Serif',serif;font-size:22px;font-style:italic;color:#fff;cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;user-select:none;flex-shrink:0}
.logo-box{background:linear-gradient(135deg,var(--accent),var(--accent2));width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.nav-area{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;flex:1;margin-left:4px}
.nav-area::-webkit-scrollbar{display:none}
.nb{background:transparent;color:var(--muted);border:none;border-radius:var(--rs);padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap;transition:all .15s}
.nb:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nb.on{background:rgba(91,141,238,.15);color:var(--accent);font-weight:600}
.top-r{display:flex;gap:6px;align-items:center;flex-shrink:0}

.btn{display:inline-flex;align-items:center;gap:5px;border:none;border-radius:10px;padding:8px 16px;font-size:13px;color:#fff;font-weight:600;line-height:1}
.btn:hover{opacity:.85}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:var(--rs)}
.btn-xs{padding:3px 9px;font-size:11px;border-radius:6px}
.btn-p{background:var(--accent)}
.btn-s{background:rgba(91,141,238,.15);color:var(--accent)}
.ghost{background:transparent;border:1px solid var(--border);border-radius:10px;padding:7px 14px;font-size:13px;color:var(--muted)}
.ghost:hover{border-color:var(--border2);color:var(--text)}
.ibtn{background:transparent;border:1px solid var(--border);border-radius:var(--rs);padding:6px 9px;font-size:15px;color:var(--muted);display:inline-flex;align-items:center}
.ibtn:hover{border-color:var(--border2);color:var(--text)}

.inp{width:100%;background:#0e1520;border:1px solid var(--border);border-radius:var(--rs);padding:8px 12px;font-size:13px;color:var(--text);outline:none}
.inp:focus{border-color:var(--accent)}
.lbl{font-size:11px;color:var(--muted);margin-bottom:5px;display:block;font-weight:600;letter-spacing:.5px;text-transform:uppercase}

#main{padding:20px 16px;max-width:1100px;width:100%;margin:0 auto}
.stitle{font-size:11px;font-weight:700;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-bottom:20px}
.nlist{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:20px}

.nc{background:var(--card);border-radius:var(--r);padding:14px;cursor:pointer;transition:transform .18s,box-shadow .18s;border:1px solid var(--border);border-left:3px solid;position:relative;overflow:hidden}
.nc:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.nc-t{font-size:14px;font-weight:600;color:#ecf2ff;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-p{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nc-p.lc{-webkit-line-clamp:3}
.nc-f{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600;white-space:nowrap}
.nc-d{font-size:10px;color:var(--dim);margin-top:7px}

.pbadge{display:inline-flex;align-items:center;gap:3px;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:.4px}
.pb-new{background:rgba(45,63,88,.5);color:var(--muted)}
.pb-learning{background:rgba(240,165,0,.15);color:var(--amber)}
.pb-review{background:rgba(91,141,238,.15);color:var(--accent)}
.pb-done{background:rgba(34,201,122,.15);color:var(--green)}

.sc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.stt{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;text-align:center}
.stv{font-size:28px;font-weight:700;color:#ecf2ff;font-family:'Instrument Serif',serif}
.stl{font-size:11px;color:var(--muted);margin-top:2px}

.ewrap{display:grid;grid-template-columns:1fr 280px;gap:14px;min-height:calc(100vh - 115px)}
.emain{background:var(--card);border-radius:var(--r);border:1px solid;display:flex;flex-direction:column;overflow:hidden}
.eside{display:flex;flex-direction:column;overflow-y:auto;padding-bottom:20px}
.etxt{display:none}/* replaced by rich-editor */
.efoot{padding:6px 16px;font-size:11px;color:var(--dim);border-top:1px solid var(--border);display:flex;gap:14px;flex-wrap:wrap}
.imgrow{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.imt{width:72px;height:58px;object-fit:cover;border-radius:6px;border:1px solid var(--border);cursor:zoom-in;display:block}
.cdot{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border .12s;flex-shrink:0}
.cdot.on{border:3px solid #fff}

.pbar{height:5px;background:var(--border);border-radius:5px;overflow:hidden}
.pbf{height:100%;border-radius:5px;transition:width .4s ease}

.fcard{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:36px 28px;text-align:center;cursor:pointer;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none}
.fcard:active{transform:scale(.99)}

.ti{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);margin-bottom:6px;cursor:default;transition:all .15s}
.ti:hover{border-color:var(--border2);background:#141d2b}
.tidot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tname{flex:1;font-size:13px;font-weight:500;color:#dce6f5;min-width:0}
.tmeta{font-size:11px;color:var(--muted)}

.tmpl{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;transition:all .15s}
.tmpl:hover{border-color:var(--accent);transform:translateY(-1px)}
.tmi{font-size:22px;margin-bottom:8px}
.tmn{font-size:13px;font-weight:600;color:#ecf2ff;margin-bottom:3px}
.tmd{font-size:11px;color:var(--muted);line-height:1.5}
.tmgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:65vh;overflow-y:auto}

.ovl{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
.mdl{background:#0e1520;border:1px solid var(--border2);border-radius:18px;padding:22px;width:100%;max-width:320px;text-align:center}
.toast-e{position:fixed;bottom:20px;right:16px;border-radius:12px;padding:10px 18px;font-size:13px;font-weight:600;z-index:999;animation:tIn .25s ease;box-shadow:0 8px 28px rgba(0,0,0,.5);color:#fff;display:none;max-width:calc(100vw - 32px)}
@keyframes tIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

#mbar{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:300;justify-content:space-around;align-items:center;display:none}
.mb{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--muted);padding:4px 10px;font-size:10px;font-weight:500}
.mb .mi{font-size:19px;line-height:1}
.mb.on{color:var(--accent)}
#fab{position:fixed;bottom:70px;right:16px;z-index:400;width:52px;height:52px;border-radius:50%;background:var(--accent);border:none;font-size:24px;color:#fff;box-shadow:0 4px 18px rgba(91,141,238,.45);align-items:center;justify-content:center;display:none}

@media(max-width:700px){
  .nav-area,.top-r .ghost,.top-r .exp-btn{display:none}
  #mbar{display:flex}
  #fab{display:flex}
  #main{padding:14px 12px;padding-bottom:120px}
  .ewrap{grid-template-columns:1fr}
  .eside{max-height:none}
  .ewrap{min-height:auto}
  .etxt{min-height:200px}
  .ngrid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:9px}
  .tmgrid{grid-template-columns:1fr}
}
@media(min-width:701px){#mbar,#fab{display:none!important}}

.fio{font-size:20px;cursor:pointer;padding:4px 6px;border-radius:6px;border:2px solid transparent;transition:.12s}
.fio:hover{border-color:var(--border2)}
.fio.on{border-color:var(--accent);background:rgba(91,141,238,.15)}
.fcdot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.12s;flex-shrink:0}
.fcdot.on{border:3px solid #fff}

/* autosave indicator */
#autosave-bar{
  position:fixed;top:54px;left:0;right:0;height:2px;background:transparent;z-index:190;
  transition:background .3s;
}
#autosave-bar.saving{background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:sweepBar 1s ease;}
#autosave-bar.saved{background:var(--green);animation:fadeBar 1.5s ease forwards;}
#autosave-bar.unsaved{background:var(--amber);}
@keyframes sweepBar{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
@keyframes fadeBar{0%{opacity:1}80%{opacity:1}100%{opacity:0}}

#autosave-hint{
  position:fixed;bottom:70px;left:50%;transform:translateX(-50%);
  background:rgba(13,18,32,.95);border:1px solid var(--border2);
  border-radius:10px;padding:7px 14px;font-size:12px;font-weight:600;
  color:var(--muted);z-index:190;display:none;white-space:nowrap;
  box-shadow:0 4px 16px rgba(0,0,0,.4);
  transition:opacity .2s;
}
#autosave-hint.show{display:block;}
#autosave-hint .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle;}

/* ── FORMAT TOOLBAR ─────────────────────────────── */
.fmt-toolbar{
  display:flex;gap:2px;padding:6px 10px;border-bottom:1px solid var(--border);
  flex-wrap:wrap;align-items:center;background:rgba(0,0,0,.15);
}
.fmt-btn{
  background:transparent;border:none;border-radius:6px;
  padding:5px 8px;font-size:13px;color:var(--muted);cursor:pointer;
  transition:all .12s;line-height:1;display:inline-flex;align-items:center;gap:3px;
  font-family:var(--font);
}
.fmt-btn:hover{background:rgba(255,255,255,.08);color:var(--text)}
.fmt-btn.active{background:rgba(91,141,238,.2);color:var(--accent)}
.fmt-sep{width:1px;height:20px;background:var(--border);margin:0 3px;flex-shrink:0}
.fmt-select{
  background:#0e1520;border:1px solid var(--border);border-radius:6px;
  padding:4px 8px;font-size:12px;color:var(--muted);outline:none;
  font-family:var(--font);cursor:pointer;
}
.fmt-select:focus{border-color:var(--accent)}

/* ── RICH EDITOR ── */
.rich-editor{
  flex:1;outline:none;padding:18px 20px;font-size:14px;
  color:#dce6f5;line-height:1.9;overflow-y:auto;
  font-family:var(--font);min-height:200px;
  word-break:break-word;
}
.rich-editor:empty:before{
  content:attr(data-placeholder);color:var(--dim);pointer-events:none;
}
.rich-editor h1{font-family:'Instrument Serif',serif;font-size:22px;font-style:italic;color:#ecf2ff;margin:12px 0 6px;border-bottom:1px solid var(--border);padding-bottom:6px}
.rich-editor h2{font-family:'Instrument Serif',serif;font-size:18px;color:#ecf2ff;margin:10px 0 5px}
.rich-editor h3{font-size:15px;font-weight:700;color:#c8d8f0;margin:8px 0 4px}
.rich-editor strong,.rich-editor b{color:#fff;font-weight:700}
.rich-editor em,.rich-editor i{color:#a5c0e8;font-style:italic}
.rich-editor u{text-decoration:underline;text-decoration-color:var(--accent)}
.rich-editor s{text-decoration:line-through;color:var(--muted)}
.rich-editor mark{background:rgba(240,165,0,.25);color:#f0c060;border-radius:3px;padding:0 3px}
.rich-editor code{background:#0e1520;border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:12px;color:#7dd3fc;font-family:'Courier New',monospace}
.rich-editor pre{background:#0e1520;border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin:8px 0;overflow-x:auto}
.rich-editor pre code{background:none;border:none;padding:0;font-size:13px}
.rich-editor ul{padding-left:20px;margin:6px 0}
.rich-editor ol{padding-left:20px;margin:6px 0}
.rich-editor li{margin:3px 0;color:#d0dff5}
.rich-editor blockquote{border-left:3px solid var(--accent);padding:8px 14px;margin:8px 0;background:rgba(91,141,238,.08);border-radius:0 8px 8px 0;color:#a0b4cc;font-style:italic}
.rich-editor a{color:var(--accent);text-decoration:underline}
.rich-editor hr{border:none;border-top:1px solid var(--border);margin:12px 0}
.rich-editor table{border-collapse:collapse;width:100%;margin:8px 0}
.rich-editor td,.rich-editor th{border:1px solid var(--border);padding:6px 10px;font-size:13px}
.rich-editor th{background:rgba(91,141,238,.1);color:var(--accent);font-weight:600}
.rich-editor img{max-width:100%;border-radius:8px;margin:8px 0}

/* word count bar */
.wc-bar{padding:5px 16px;font-size:11px;color:var(--dim);border-top:1px solid var(--border);display:flex;gap:14px;flex-wrap:wrap;align-items:center}

/* ── COMMUNITY FEED ── */
.comm-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden;transition:border-color .2s}
.comm-card:hover{border-color:var(--border2)}
.comm-header{padding:12px 14px 8px;display:flex;align-items:center;gap:10px}
.comm-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.comm-user{flex:1;min-width:0}
.comm-username{font-size:13px;font-weight:600;color:#ecf2ff}
.comm-meta{font-size:11px;color:var(--muted)}
.comm-body{padding:0 14px 10px}
.comm-title{font-family:'Instrument Serif',serif;font-size:17px;font-style:italic;color:#ecf2ff;margin-bottom:5px;cursor:pointer}
.comm-title:hover{color:var(--accent)}
.comm-content{font-size:12px;color:var(--muted);line-height:1.65;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.comm-footer{padding:8px 14px 12px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--border)}
.comm-tag{background:rgba(91,141,238,.12);color:var(--accent);border-radius:20px;padding:2px 8px;font-size:11px;font-weight:600}
.comm-likes{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;font-family:var(--font);padding:4px 8px;border-radius:8px;transition:.15s}
.comm-likes:hover{background:rgba(255,255,255,.05);color:var(--red)}
.comm-likes.liked{color:var(--red)}
.pub-modal{background:#0e1520;border:1px solid var(--border2);border-radius:18px;padding:22px;width:100%;max-width:420px;max-height:80vh;overflow-y:auto}
</style>
</head>
<body>

<div id="topbar">
  <div class="logo" onclick="go('home')">
    <div class="logo-box">🧠</div>NeurоNotepad
  </div>
  <div class="nav-area" id="nav-area">
    <button class="nb on" id="nb-home" onclick="go('home')">🏠 Bosh sahifa</button>
    <button class="nb" id="nb-comm" onclick="go('comm')">🌐 Jamoat</button>
    <button class="nb" id="nb-neuro" onclick="go('neuro')">🧠 Nevrologiya</button>
    <button class="nb" id="nb-flash" onclick="go('flash')">🃏 Flashcards</button>
    <button class="nb" id="nb-prog" onclick="go('prog')">📈 Progress</button>
    <button class="nb" id="nb-stats" onclick="go('stats')">📊 Statistika</button>
    <!-- dynamic fan buttons inserted here by JS -->
    <div id="dyn-fans" style="display:contents"></div>
    <button class="nb" id="nb-addfan" onclick="showAddFan()" style="color:var(--accent);border:1px dashed rgba(91,141,238,.4);border-radius:var(--rs);padding:5px 11px">＋ Fan</button>
  </div>
  <div class="top-r">
    <button class="ghost exp-btn" onclick="exportData()" style="font-size:12px;padding:6px 11px">⬇</button>
    <input type="file" accept=".json" id="impf" style="display:none" onchange="importData(event)"/>
    <button class="ghost exp-btn" onclick="document.getElementById('impf').click()" style="font-size:12px;padding:6px 11px">⬆</button>
    <button class="btn btn-p btn-sm" onclick="newNote()">+ Yangi</button>
  </div>
</div>

<div id="autosave-bar"></div>
<div id="autosave-hint"></div>
<div id="mbar">
  <button class="mb on" id="mb-home" onclick="go('home')"><span class="mi">🏠</span>Bosh</button>
  <button class="mb" id="mb-comm" onclick="go('comm')"><span class="mi">🌐</span>Jamoat</button>
  <button class="mb" id="mb-neuro" onclick="go('neuro')"><span class="mi">🧠</span>Nevro</button>
  <button class="mb" id="mb-flash" onclick="go('flash')"><span class="mi">🃏</span>Flash</button>
  <button class="mb" id="mb-prog" onclick="go('prog')"><span class="mi">📈</span>Progress</button>
  <button class="mb" id="mb-stats" onclick="go('stats')"><span class="mi">📊</span>Stat</button>
</div>
<button id="fab" onclick="newNote()">＋</button>
<div id="main"></div>
<div class="toast-e" id="te"></div>

<div class="ovl" id="del-modal" style="display:none">
  <div class="mdl">
    <div style="font-size:34px;margin-bottom:10px">🗑</div>
    <div style="font-size:16px;font-weight:700;color:#ecf2ff;margin-bottom:6px">O'chirishni tasdiqlang</div>
    <div style="font-size:13px;color:var(--muted);margin-bottom:20px">Konspekt o'chib ketadi.</div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="ghost" onclick="cm('del-modal')">Bekor</button>
      <button class="btn" style="background:#e05555" id="del-ok">Ha, o'chir</button>
    </div>
  </div>
</div>

<div class="ovl" id="tmpl-modal" style="display:none">
  <div class="mdl" style="max-width:520px;text-align:left;padding:18px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div style="font-size:16px;font-weight:700;color:#ecf2ff">📋 Shablon tanlang</div>
      <button class="ibtn" onclick="cm('tmpl-modal')" style="font-size:13px;padding:4px 8px">✕</button>
    </div>
    <div class="tmgrid" id="tlist"></div>
  </div>
</div>

<div class="ovl" id="lb" style="display:none">
  <div style="position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%" onclick="cm('lb')">
    <img id="lbimg" style="max-width:90vw;max-height:90vh;border-radius:12px;object-fit:contain;touch-action:pinch-zoom;cursor:zoom-out" onclick="event.stopPropagation()"/>
    <button onclick="cm('lb')" style="position:fixed;top:16px;right:16px;background:rgba(0,0,0,.7);border:1px solid #334;border-radius:50%;width:36px;height:36px;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10">✕</button>
    <div id="lb-info" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);border-radius:8px;padding:6px 14px;font-size:12px;color:#94a3b8;white-space:nowrap"></div>
  </div>
</div>

<!-- ADD FAN MODAL -->
<div class="ovl" id="addfan-modal" style="display:none">
  <div class="mdl" style="max-width:380px;text-align:left;padding:22px">

let notes=JSON.parse(localStorage.getItem('nn4_notes')||'[]');
let customSubj=JSON.parse(localStorage.getItem('nn4_subj')||'[]');
let topicProg=JSON.parse(localStorage.getItem('nn4_tp')||'{}');
let view='home',editing=null;
let sq='',fsubj='all',fcol='all',sort='date',grid=true;
let fi=0,ff=false;

function save(){localStorage.setItem('nn4_notes',JSON.stringify(notes));localStorage.setItem('nn4_subj',JSON.stringify(customSubj));localStorage.setItem('nn4_tp',JSON.stringify(topicProg));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function asubj(){ return ['Nevrologiya',...customSubj]; } function asubjNames(){ return ['Nevrologiya',...customSubj.map(getFanName)]; }
function wc(t){return(t||'').split(/\s+/).filter(Boolean).length}
function fd(ts){return new Date(ts).toLocaleDateString('uz-UZ',{day:'2-digit',month:'short',year:'numeric'})}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function toast(msg,type='ok'){
  const e=document.getElementById('te');
  e.textContent=msg;e.style.background=type==='err'?'#e05555':'#22c97a';
  e.style.display='block';clearTimeout(window._tt);
  window._tt=setTimeout(()=>e.style.display='none',2600);
}

// go() replaced by JS below

function newNote(subj,txt,title){
  const n={id:uid(),title:title||'',content:txt||'',subject:subj||asubj()[0],
    color:COLORS[0],images:[],tags:[],pinned:false,starred:false,progress:'new',
    createdAt:Date.now(),updatedAt:Date.now()};
  notes.unshift(n);save();editing={...n};
  ['home','comm','neuro','flash','prog','stats'].forEach(k=>{
    document.getElementById('nb-'+k)?.classList.remove('on');
    document.getElementById('mb-'+k)?.classList.remove('on');
  });
  go('editor');
}

let _autosaveTimer=null;
let _lastSavedContent='';
let _lastSavedTitle='';
let _autoSaveInterval=null;

function saveNote(silent){
  if(!editing)return;
  editing.updatedAt=Date.now();
  const i=notes.findIndex(x=>x.id===editing.id);
  if(i>=0)notes[i]={...editing};
  save();
  _lastSavedContent=editing.content||'';
  _lastSavedTitle=editing.title||'';
  // clear draft
  localStorage.removeItem('nn4_draft_'+editing.id);
  if(!silent){
    toast('Saqlandi ✓');
    showSaveBar('saved');
  }
  showHint('saved');
  updateSaveBtn(false);
}

function autoSave(){
  if(!editing)return;
  const re=document.getElementById('rich-ed');
  if(re&&!_srcMode)editing.content=re.innerHTML;
  const changed=(editing.content||'')!==_lastSavedContent||(editing.title||'')!==_lastSavedTitle;
  if(!changed)return;
  showSaveBar('saving');
  showHint('saving');
  setTimeout(()=>{
    editing.updatedAt=Date.now();
    const i=notes.findIndex(x=>x.id===editing.id);
    if(i>=0)notes[i]={...editing};
    save();
    _lastSavedContent=editing.content||'';
    _lastSavedTitle=editing.title||'';
    showSaveBar('saved');
    showHint('saved');
    updateSaveBtn(false);
  },300);
}

function showSaveBar(state){
  const bar=document.getElementById('autosave-bar');
  if(!bar)return;
  bar.className='';
  void bar.offsetWidth;
  bar.className=state;
}

function showHint(state){
  const hint=document.getElementById('autosave-hint');
  if(!hint)return;
  if(state==='unsaved'){
    hint.innerHTML=`<span class="dot" style="background:var(--amber)"></span>Saqlanmagan o'zgarishlar...`;
    hint.classList.add('show');
  } else if(state==='saving'){
    hint.innerHTML=`<span class="dot" style="background:var(--accent)"></span>Saqlanmoqda...`;
    hint.classList.add('show');
  } else if(state==='saved'){
    hint.innerHTML=`<span class="dot" style="background:var(--green)"></span>Avtomatik saqlandi ✓`;
    hint.classList.add('show');
    clearTimeout(window._hintT);
    window._hintT=setTimeout(()=>hint.classList.remove('show'),2000);
  }
}

function updateSaveBtn(unsaved){
  const btn=document.getElementById('save-btn');
  if(!btn)return;
  if(unsaved){
    btn.style.background='var(--amber)';
    btn.textContent='● Saqlash';
  } else {
    btn.style.background='var(--accent)';
    btn.textContent='💾 Saqlandi';
  }
}

function startAutosave(){
  _lastSavedContent=editing?.content||'';
  _lastSavedTitle=editing?.title||'';
  clearInterval(_autoSaveInterval);
  _autoSaveInterval=setInterval(autoSave,30000); // 30 soniya
}

function stopAutosave(){
  clearInterval(_autoSaveInterval);
  _autoSaveInterval=null;
}

function toggleStar(id){const n=notes.find(x=>x.id===id);if(n){n.starred=!n.starred;save();}}

  const lbimg = document.getElementById('lbimg');

  document.getElementById('lb').style.display='flex';
  // show info
  const info = document.getElementById('lb-info');
  if(info && imgObj){
    info.textContent = `${imgObj.name} · ${imgObj.size||'?'}KB${imgObj.width?' · '+imgObj.width+'×'+imgObj.height+'px':''}${imgObj.compressed?' · 🗜 siqilgan':''}`;
  } else if(info){
    info.textContent='';
  }
}

function gf(){
  return notes.filter(n=>{
    const q=sq.toLowerCase();
    const ms=!q||[n.title,n.content,n.subject,...(n.tags||[])].some(t=>(t||'').toLowerCase().includes(q));
    const mj=fsubj==='all'||n.subject===fsubj;
    const mc=fcol==='all'||n.color===fcol;
    return ms&&mj&&mc;
  }).sort((a,b)=>{
    if(a.pinned!==b.pinned)return a.pinned?-1:1;
    if(sort==='date')return b.updatedAt-a.updatedAt;
    if(sort==='title')return(a.title||'').localeCompare(b.title||'');
    if(sort==='words')return wc(b.content)-wc(a.content);
    return 0;
  });
}

    <div class="nc-t">${esc(n.title)||'Nomsiz'}</div>
    <div class="nc-p${list?' lc':''}">${esc(n.content)||"Kontent yo'q..."}</div>
    <div class="nc-f">
      <span class="chip" style="background:${n.color}18;color:${n.color}">${esc(n.subject)}</span>
      ${pb(n.progress||'new')}
      ${(n.images||[]).length?`<span class="chip" style="background:#2d3f5818;color:var(--muted)">📸${n.images.length}</span>`:''}

// ── IMAGE COMPRESS ──────────────────────────────────────────────
const IMG_MAX_W = 1200;   // max width px
const IMG_MAX_H = 1200;   // max height px
const IMG_QUALITY = 0.75; // JPEG quality
const IMG_MAX_KB = 300;   // max KB per image

function formatBytes(bytes){
  if(bytes<1024)return bytes+'B';
  if(bytes<1024*1024)return (bytes/1024).toFixed(1)+'KB';
  return (bytes/1024/1024).toFixed(1)+'MB';
}

function base64Size(b64){ return Math.round((b64.length*3/4)/1024); }

function compressImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        let {width:w, height:h} = img;
        // Scale down if needed
        const ratio = Math.min(IMG_MAX_W/w, IMG_MAX_H/h, 1);
        w = Math.round(w*ratio);
        h = Math.round(h*ratio);

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);

        // Try different qualities until under limit
        let quality = IMG_QUALITY;
        let url = canvas.toDataURL('image/jpeg', quality);
        while(base64Size(url) > IMG_MAX_KB && quality > 0.3){
          quality -= 0.1;
          url = canvas.toDataURL('image/jpeg', quality);
        }

        const origKB = Math.round(file.size/1024);
        const newKB = base64Size(url);
        resolve({
          id: uid(),
          url,
          name: file.name,
          ts: Date.now(),
          origSize: origKB,
          size: newKB,
          width: w,
          height: h,
          compressed: origKB > newKB
        });
      };
      img.onerror = () => resolve(null);
      img.src = ev.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

function checkStorageQuota(){
  try{
    const total = JSON.stringify(notes).length + JSON.stringify(customSubj).length;
    const totalKB = Math.round(total/1024);
    const limitKB = 4500; // safe limit ~4.5MB of 5MB
    return { used: totalKB, limit: limitKB, pct: Math.round(totalKB/limitKB*100) };
  }catch(e){ return {used:0,limit:4500,pct:0}; }
}

async function addImgs(e){
  const files = Array.from(e.target.files);
  if(!files.length)return;

  // Show loading state
  const btn = document.querySelector('#imginp+button') || document.querySelector('[onclick*="imginp"]');
  const origText = btn?.textContent;
  if(btn){ btn.textContent='⏳ Siqilmoqda...'; btn.disabled=true; }

  let successCount = 0;
  let savedKB = 0;

  for(const file of files){
    // Check storage before adding
    const quota = checkStorageQuota();
    if(quota.pct >= 90){
      toast(`⚠️ Xotira ${quota.pct}% to'lgan! Rasm siqilmadi.`, 'err');
      break;
    }

    const compressed = await compressImage(file);
    if(!compressed){ toast(`Rasm o'qilmadi: ${file.name}`, 'err'); continue; }

    editing.images = [...(editing.images||[]), compressed];
    savedKB += (compressed.origSize - compressed.size);
    successCount++;
  }

  rfImgs();
  updateStorageBar();

  if(btn){ btn.textContent = origText||'📷 Rasm yuklash'; btn.disabled=false; }

  if(successCount > 0){
    const msg = savedKB > 10
      ? `📸 ${successCount} rasm yuklandi · ${savedKB}KB tejlandi ✓`
      : `📸 ${successCount} rasm yuklandi ✓`;
    toast(msg);
  }
  e.target.value='';
}

function updateStorageBar(){
  const bar = document.getElementById('storage-bar-fill');
  const label = document.getElementById('storage-bar-label');
  if(!bar||!label)return;
  const q = checkStorageQuota();
  const color = q.pct>80?'var(--red)':q.pct>60?'var(--amber)':'var(--green)';
  bar.style.width = Math.min(q.pct,100)+'%';
  bar.style.background = color;
  label.textContent = `Xotira: ${q.used}KB / ${q.limit}KB (${q.pct}%)`;
  label.style.color = q.pct>80?'var(--red)':q.pct>60?'var(--amber)':'var(--muted)';
}
function rmImg(id){editing.images=(editing.images||[]).filter(i=>i.id!==id);rfImgs();}
function rfImgs(){
  const row=document.getElementById('imgrow');if(!row)return;
  const imgs=editing.images||[];
  row.style.display=imgs.length?'flex':'none';
  row.innerHTML=imgs.map(img=>`<div style="position:relative;flex-shrink:0;text-align:center">
    <img src="${img.url}" class="imt" onclick="showLB(this.src)" title="${esc(img.name)}"/>
    <button onclick="rmImg('${img.id}')" style="position:absolute;top:-5px;right:-5px;background:#e05555;border:none;border-radius:50%;width:16px;height:16px;color:#fff;font-size:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1">×</button>
    <div style="font-size:9px;color:var(--dim);margin-top:2px;white-space:nowrap">
      ${img.size?img.size+'KB':''}${img.compressed?' ✓':''}
    </div>
  </div>`).join('');
  updateStorageBar();
}

function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(Array.isArray(d.notes)){notes=[...d.notes,...notes];if(d.customSubj)customSubj=[...new Set([...customSubj,...d.customSubj])];if(d.topicProg)topicProg={...d.topicProg,...topicProg};save();toast(d.notes.length+' ta yuklandi ⬆');rHome();}
      else if(Array.isArray(d)){notes=[...d,...notes];save();toast(d.length+' ta yuklandi ⬆');rHome();}
    }catch{toast('Format xato!','err');}
  };
  r.readAsText(f);e.target.value='';
}



// ══════════════════════════════════════════════════
// 🖊 RICH TEXT EDITOR FUNCTIONS
// ══════════════════════════════════════════════════

let _srcMode = false;

function fmt(cmd, val){
  document.getElementById('rich-ed')?.focus();
  document.execCommand(cmd, false, val||null);
  onRichInput();
  updateToolbarState();
}

function fmtBlock(tag){
  if(!tag)return;
  document.getElementById('rich-ed')?.focus();
  document.execCommand('formatBlock', false, tag);
  onRichInput();
}

function fmtMark(){
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed)return;
  const range=sel.getRangeAt(0);
  const mark=document.createElement('mark');
  try{range.surroundContents(mark);}
  catch(e){document.execCommand('insertHTML',false,`<mark>${sel.toString()}</mark>`);}
  onRichInput();
}

function fmtCode(){
  const sel=window.getSelection();
  const txt=sel?.toString()||'';
  if(txt){
    document.execCommand('insertHTML',false,`<code>${txt.replace(/</g,'&lt;')}</code>`);
  } else {
    document.execCommand('insertHTML',false,`<code>kod</code>`);
  }
  onRichInput();
}

function fmtHR(){
  document.execCommand('insertHTML',false,'<hr/>');
  onRichInput();
}

function fmtTable(){
  const html=`<table><tr><th>Ustun 1</th><th>Ustun 2</th><th>Ustun 3</th></tr><tr><td>Ma'lumot</td><td>Ma'lumot</td><td>Ma'lumot</td></tr><tr><td></td><td></td><td></td></tr></table><p><br></p>`;
  document.execCommand('insertHTML',false,html);
  onRichInput();
}

function fmtLink(){
  const url=prompt("Havola URL si:", "https://");
  if(url){
    const sel=window.getSelection();
    const txt=sel?.toString()||'Havola';
    document.execCommand('insertHTML',false,`<a href="${url}" target="_blank">${txt}</a>`);
    onRichInput();
  }
}

function onRichInput(){
  if(_srcMode)return;
  const re=document.getElementById('rich-ed');
  if(!re)return;
  editing.content=re.innerHTML;
  onContentChange();
  upSt();
}

function onSrcInput(){
  const se=document.getElementById('src-ed');
  const re=document.getElementById('rich-ed');
  if(!se||!re)return;
  re.innerHTML=se.value;
  editing.content=se.value;
  onContentChange();
}

function toggleSrcMode(){
  _srcMode=!_srcMode;
  const re=document.getElementById('rich-ed');
  const se=document.getElementById('src-ed');
  const btn=document.getElementById('src-mode-btn');
  const tb=document.getElementById('fmt-toolbar');
  if(!re||!se)return;
  if(_srcMode){
    se.value=re.innerHTML;
    re.style.display='none';
    se.style.display='block';
    if(btn)btn.classList.add('active');
    // hide toolbar buttons except src mode btn
    if(tb)tb.querySelectorAll('.fmt-btn:not(#src-mode-btn),.fmt-sep,.fmt-select').forEach(el=>el.style.opacity='0.3');
  } else {
    re.innerHTML=se.value;
    editing.content=se.value;
    re.style.display='block';
    se.style.display='none';
    if(btn)btn.classList.remove('active');
    if(tb)tb.querySelectorAll('.fmt-btn:not(#src-mode-btn),.fmt-sep,.fmt-select').forEach(el=>el.style.opacity='1');
  }
}

function updateToolbarState(){
  const cmds=['bold','italic','underline','strikeThrough'];
  const labels=['B','I','U','S'];
  document.querySelectorAll('.fmt-toolbar .fmt-btn').forEach(btn=>{
    const txt=btn.querySelector('b,i,u,s')?.tagName?.toLowerCase();
    if(txt){
      const cmd=txt==='b'?'bold':txt==='i'?'italic':txt==='u'?'underline':'strikeThrough';
      btn.classList.toggle('active',document.queryCommandState(cmd));
    }
  });
}

function onRichKey(e){
  // Ctrl+S save
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveNote();return;}
  // Ctrl+B Bold
  if((e.ctrlKey||e.metaKey)&&e.key==='b'){e.preventDefault();fmt('bold');return;}
  // Ctrl+I Italic
  if((e.ctrlKey||e.metaKey)&&e.key==='i'){e.preventDefault();fmt('italic');return;}
  // Ctrl+U Underline
  if((e.ctrlKey||e.metaKey)&&e.key==='u'){e.preventDefault();fmt('underline');return;}
  // Tab -> indent
  if(e.key==='Tab'){
    e.preventDefault();
    document.execCommand('insertHTML',false,'&nbsp;&nbsp;&nbsp;&nbsp;');
  }
}

function getRichText(){
  const re=document.getElementById('rich-ed');
  return re?re.innerHTML:'';
}

function setRichText(html){
  const re=document.getElementById('rich-ed');
  if(re)re.innerHTML=html||'';
}

function addFanConfirm(){

function delFan(idx){
  const fan=customSubj[idx];
  const fanName=fan?.name||fan;

    customSubj.splice(idx,1);
    save();
    renderDynFans();
    toast("Fan o'chirildi",'err');
    showAddFan();
  }
}

function getFanName(s){ return typeof s==='object' ? s.name : s; }
function getFanIcon(s){ return typeof s==='object' ? (s.icon||'📚') : '📚'; }
function getFanColor(s){ return typeof s==='object' ? (s.color||'#5b8dee') : '#5b8dee'; }
function getFanLabel(s){ return getFanIcon(s)+' '+getFanName(s); }

function asubj(){ return ['Nevrologiya',...customSubj]; }
function asubjNames(){ return ['Nevrologiya',...customSubj.map(getFanName)]; }

function renderDynFans(){
  const wrap=document.getElementById('dyn-fans');
  if(!wrap)return;
  wrap.innerHTML=customSubj.map((s,i)=>{
    const name=getFanName(s);
    const icon=getFanIcon(s);
    const col=getFanColor(s);
    const id='nb-fan-'+i;
    return`<button class="nb" id="${id}" onclick="go('fan','${esc(name)}')" style="display:flex;align-items:center;gap:4px">
      <span style="font-size:13px">${icon}</span>${esc(name)}
    </button>`;
  }).join('');
}

function go(v,arg){
  if(view==='editor'&&v!=='editor'){stopAutosave();clearInterval(window._draftTimer);}
  view=v;
  ['home','comm','neuro','flash','prog','stats'].forEach(k=>{
    document.getElementById('nb-'+k)?.classList.toggle('on',k===v);
    document.getElementById('mb-'+k)?.classList.toggle('on',k===v);
  });
  // dynamic fan buttons
  document.querySelectorAll('[id^="nb-fan-"]').forEach(b=>b.classList.remove('on'));
  if(v==='fan' && arg){
    customSubj.forEach((s,i)=>{ if(getFanName(s)===arg) document.getElementById('nb-fan-'+i)?.classList.add('on'); });
  }
  if(v==='home')rHome();
  else if(v==='neuro')rNeuro();
  else if(v==='flash')rFlash();
  else if(v==='prog')rProg();
  else if(v==='stats')rStats();
  else if(v==='editor')rEditor();
  else if(v==='detail')rDetail(arg);
  else if(v==='fan')rFan(arg);
  else if(v==='comm')rComm();
  window.scrollTo(0,0);
}

function rFan(fanName){
  const fanObj=customSubj.find(s=>getFanName(s)===fanName);
  const icon=fanObj?getFanIcon(fanObj):'📚';
  const col=fanObj?getFanColor(fanObj):'#5b8dee';
  const fanNotes=notes.filter(n=>n.subject===fanName).sort((a,b)=>b.updatedAt-a.updatedAt);
  const done=fanNotes.filter(n=>(n.progress||'new')==='done').length;
  document.getElementById('main').innerHTML=`

      <div style="font-size:13px;color:var(--muted)">${fanNotes.length} ta konspekt · ${done} ta o'rganildi</div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn btn-s btn-sm" onclick="showTmpl('${esc(fanName)}')">&#128203; Shablon</button>
      <button class="btn btn-p btn-sm" onclick="newNote('${esc(fanName)}')" style="background:${col}">+ Konspekt</button>
    </div>
  </div>
  ${fanNotes.length===0?`<div style="text-align:center;padding:60px 16px">
    <div style="font-size:44px;margin-bottom:12px">${icon}</div>
    <div style="font-size:16px;font-weight:700;color:#4a6080;margin-bottom:8px">${esc(fanName)} bo'yicha hali konspekt yo'q</div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px">
      <button class="btn btn-s" onclick="showTmpl('${esc(fanName)}')">&#128203; Shablon bilan boshlash</button>
      <button class="btn btn-p" onclick="newNote('${esc(fanName)}')" style="background:${col}">+ Bo'sh konspekt</button>
    </div>
  </div>`:`
  <div class="stitle">&#128218; Barcha konspektlar (${fanNotes.length})</div>
  <div class="ngrid">${fanNotes.map(n=>nc(n,false)).join('')}</div>`}`;
}

const GITHUB_TOKEN = 'ghp_1HSkEf3v0vyk03Jregw9kh4DQc45MQ2Huep7';
const GITHUB_USERNAME = 'medsee';
const GIST_DESCRIPTION = 'NeurоNotepad Jamoat Konspektlari';
const GIST_FILENAME = 'neuronotepad_community.json';
let _gistId = localStorage.getItem('nn4_gist_id') || null;
let _commFilter = 'all';
let _commLikes = JSON.parse(localStorage.getItem('nn4_comm_likes') || '{}');

// ── Gist ID ni topish yoki yaratish ──────────────
async function getOrCreateGist() {
  if (_gistId) return _gistId;
  // Search existing gists
  try {
    const res = await fetch('https://api.github.com/gists?per_page=100', {
      headers: { Authorization: `token ${GITHUB_TOKEN}`, Accept: 'application/vnd.github.v3+json' }
    });
    const gists = await res.json();
    const found = Array.isArray(gists) && gists.find(g => g.description === GIST_DESCRIPTION && g.files[GIST_FILENAME]);
    if (found) {
      _gistId = found.id;
      localStorage.setItem('nn4_gist_id', _gistId);
      return _gistId;
    }
  } catch(e) {}
  // Create new gist
  try {
    const res = await fetch('https://api.github.com/gists', {
      method: 'POST',
      headers: { Authorization: `token ${GITHUB_TOKEN}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({
        description: GIST_DESCRIPTION,
        public: true,
        files: { [GIST_FILENAME]: { content: JSON.stringify({ notes: [], updated: Date.now() }) } }
      })
    });
    const g = await res.json();
    if (g.id) {
      _gistId = g.id;
      localStorage.setItem('nn4_gist_id', _gistId);
      return _gistId;
    }
  } catch(e) {}
  return null;
}

// ── Gist'dan ma'lumot olish ──────────────────────
async function fetchCommunityNotes() {
  const id = await getOrCreateGist();
  if (!id) return [];
  try {
    const res = await fetch(`https://api.github.com/gists/${id}`, {
      headers: { Authorization: `token ${GITHUB_TOKEN}`, Accept: 'application/vnd.github.v3+json', 'Cache-Control': 'no-cache' }
    });
    const g = await res.json();
    const raw = g.files?.[GIST_FILENAME]?.content;
    if (!raw) return [];
    const data = JSON.parse(raw);
    return Array.isArray(data.notes) ? data.notes : [];
  } catch(e) { return []; }
}

// ── Gist'ga yozish ───────────────────────────────
async function saveCommunityNotes(notesList) {
  const id = await getOrCreateGist();
  if (!id) return false;
  try {
    const res = await fetch(`https://api.github.com/gists/${id}`, {
      method: 'PATCH',
      headers: { Authorization: `token ${GITHUB_TOKEN}`, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ files: { [GIST_FILENAME]: { content: JSON.stringify({ notes: notesList, updated: Date.now() }) } } })
    });
    return res.ok;
  } catch(e) { return false; }
}

    </div>
    <div style="background:rgba(240,165,0,.08);border:1px solid rgba(240,165,0,.2);border-radius:8px;padding:10px;margin-bottom:14px;font-size:12px;color:var(--amber)">
      ⚠️ Nashr qilingan konspekt GitHub Gist'da ommaviy saqlanadi. Hamma ko'ra oladi.
    </div>
    <div style="display:flex;gap:8px">
      <button class="ghost" style="flex:1" onclick="document.getElementById('pub-modal-overlay').style.display='none'">Bekor</button>
      <button class="btn btn-p" style="flex:1;justify-content:center" onclick="confirmPublish('${noteId}')">🚀 Nashr qilish</button>
    </div>`;
}

async function confirmPublish(noteId) {
  const note = notes.find(n => n.id === noteId);
  if (!note) return;
  const author = document.getElementById('pub-author')?.value?.trim() || 'Anonim';
  const uni = document.getElementById('pub-uni')?.value?.trim() || '';
  const btn = document.querySelector('#pub-modal-content .btn-p');
  if (btn) { btn.textContent = '⏳ Yuklanmoqda...'; btn.disabled = true; }

  // Prepare note for community (strip large images to save space)
  const pubNote = {
    id: 'pub_' + note.id + '_' + Date.now(),
    title: note.title || 'Nomsiz',
    content: note.content || '',
    subject: note.subject,
    color: note.color || '#5b8dee',
    tags: note.tags || [],
    author,
    uni,
    avatar: author.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2),
    likes: 0,
    publishedAt: Date.now(),
    images: (note.images || []).slice(0, 2).map(img => ({ url: img.url?.slice(0,500)||'', name: img.name||'' }))
  };

  const existing = await fetchCommunityNotes();
  const updated = [pubNote, ...existing].slice(0, 200); // max 200 ta
  const ok = await saveCommunityNotes(updated);

  document.getElementById('pub-modal-overlay').style.display = 'none';
  if (ok) {
    toast('Jamoatga nashr qilindi 🚀');
    // Mark note as published
    note.isPublished = true;
    const i = notes.findIndex(x => x.id === noteId);
    if (i >= 0) notes[i] = note;
    save();
  } else {
    toast('Xato yuz berdi. Internet borligini tekshiring', 'err');
  }
}

// ── Like bosish (localStorage) ───────────────────
function toggleCommLike(noteId, btn) {
  if (_commLikes[noteId]) {
    delete _commLikes[noteId];
    if (btn) { btn.classList.remove('liked'); btn.innerHTML = `🤍 ${parseInt(btn.dataset.count||0)}`; }
  } else {
    _commLikes[noteId] = true;
    if (btn) { btn.classList.add('liked'); btn.innerHTML = `❤️ ${parseInt(btn.dataset.count||0)+1}`; }
    toast('Like bosildi ❤️');
  }
  localStorage.setItem('nn4_comm_likes', JSON.stringify(_commLikes));
}

    <div>
      <div style="font-family:'Instrument Serif',serif;font-size:24px;font-style:italic;color:#ecf2ff">🌐 Jamoat konspektlari</div>

let _allCommNotes = [];

async function loadCommNotes() {
  _allCommNotes = await fetchCommunityNotes();
  renderCommList();
}

function setCommFilter(val, el) {
  _commFilter = val;
  document.querySelectorAll('#comm-filters .fchip').forEach(c => c.classList.remove('on'));
  el?.classList.add('on');
  renderCommList();
}

function renderCommList() {
  let list = [..._allCommNotes];
  if (_commFilter === 'new') list = list.sort((a,b) => b.publishedAt - a.publishedAt);
  else if (_commFilter === 'hot') list = list.sort((a,b) => (b.likes||0) - (a.likes||0));
  else if (_commFilter !== 'all') list = list.filter(n => n.subject === _commFilter);

  const el = document.getElementById('comm-list');
  if (!el) return;
  if (!list.length) {
    el.innerHTML = `<div style="text-align:center;padding:60px 16px">
      <div style="font-size:48px;margin-bottom:12px">📭</div>
      <div style="font-size:16px;font-weight:700;color:#4a6080;margin-bottom:8px">Hali konspekt yo'q</div>
      <div style="font-size:13px;color:var(--dim);margin-bottom:16px">Birinchi bo'lib o'z konspektingizni ulashing!</div>
      <button class="btn btn-p" onclick="showPublishPicker()">📤 Konspekt ulashish</button>
    </div>`;
    return;
  }
  el.innerHTML = list.map(n => commCardHTML(n)).join('');
}

function commCardHTML(n) {
  const liked = !!_commLikes[n.id];
  const likeCount = (n.likes||0) + (liked ? 1 : 0);
  const fd2 = (ts) => { if(!ts)return''; const d=new Date(ts); const diff=Math.floor((Date.now()-d)/1000); if(diff<60)return'Hozirgina'; if(diff<3600)return Math.floor(diff/60)+' daqiqa oldin'; if(diff<86400)return Math.floor(diff/3600)+' soat oldin'; return Math.floor(diff/86400)+' kun oldin'; };
  // strip HTML for preview
  const div = document.createElement('div');
  div.innerHTML = n.content || '';
  const plainText = div.innerText || div.textContent || '';

  return `<div class="comm-card">
    <div class="comm-header">
      <div class="comm-avatar">${esc(n.avatar||'?')}</div>
      <div class="comm-user">
        <div class="comm-username">${esc(n.author||'Anonim')}</div>
        <div class="comm-meta">${esc(n.uni||'')}${n.uni?' · ':''}${fd2(n.publishedAt)}</div>
      </div>
      <span style="background:${n.color||'#5b8dee'}18;color:${n.color||'#5b8dee'};border-radius:20px;padding:2px 9px;font-size:11px;font-weight:600">${esc(n.subject||'')}</span>
    </div>
    <div class="comm-body">
      <div class="comm-title" onclick="showCommDetail('${n.id}')">${esc(n.title)}</div>
      <div class="comm-content">${esc(plainText)}</div>
    </div>
    ${(n.tags||[]).length ? `<div style="padding:0 14px 8px;display:flex;gap:5px;flex-wrap:wrap">${(n.tags||[]).slice(0,4).map(t=>`<span class="comm-tag">#${esc(t)}</span>`).join('')}</div>` : ''}
    <div class="comm-footer">
      <button class="comm-likes ${liked?'liked':''}" data-count="${n.likes||0}"
        id="cl-${n.id}"
        onclick="toggleCommLike('${n.id}',this)">
        ${liked?'❤️':'🤍'} ${likeCount}
      </button>
      <button class="comm-likes" onclick="showCommDetail('${n.id}')">💬 O'qish</button>
      <div style="flex:1"></div>
      <button class="comm-likes" onclick="copyCommLink('${n.id}')">↗ Ulashish</button>
    </div>
  </div>`;
}

function saveCommNote(noteId) {
  const cn = _allCommNotes.find(x => x.id === noteId);

function copyCommLink(noteId) {

}
