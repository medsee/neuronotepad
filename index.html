<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>MedNotepad</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,700;1,9..144,300;1,9..144,400;1,9..144,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap');

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#04070d;
  --surface:#080d18;
  --card:#0b1120;
  --card2:#0e1628;
  --border:#14243a;
  --border2:#1e3452;
  --border3:#2a4570;
  --accent:#3d7fff;
  --accent2:#6c3fff;
  --accent3:#00c8ff;
  --green:#00e87a;
  --amber:#ffb340;
  --red:#ff4d6a;
  --pink:#e040fb;
  --text:#e8f0ff;
  --muted:#5a7399;
  --dim:#1e3452;
  --r:16px;--rs:10px;
  --font:'DM Sans',system-ui,sans-serif;
  --serif:'Fraunces',Georgia,serif;
  --glow:0 0 40px rgba(61,127,255,.15);
  --glow2:0 0 60px rgba(108,63,255,.12);
}

body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  min-height:100vh;overflow-x:hidden;font-size:14px;line-height:1.65;
  background-image:
    radial-gradient(ellipse 80% 50% at 20% -10%,rgba(61,127,255,.08) 0%,transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 110%,rgba(108,63,255,.06) 0%,transparent 60%);
  background-attachment:fixed;
}

/* scrollbar */
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
input,textarea,select{font-family:var(--font)}
input::placeholder,textarea::placeholder{color:var(--dim)}
select option{background:#0b1120;color:var(--text)}
button{font-family:var(--font);cursor:pointer;transition:all .18s cubic-bezier(.4,0,.2,1)}
button:active{transform:scale(.96)}
a{color:var(--accent)}

/* ── TOPBAR ──────────────────────────────────── */
#topbar{
  background:rgba(8,13,24,.88);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid rgba(20,36,58,.8);
  padding:0 16px;height:54px;display:flex;align-items:center;gap:8px;
  position:sticky;top:0;z-index:200;
}

.logo{
  font-family:var(--serif);font-size:19px;font-weight:500;font-style:italic;
  color:#fff;cursor:pointer;display:flex;align-items:center;gap:7px;
  white-space:nowrap;user-select:none;flex-shrink:0;letter-spacing:-.3px;
}
.logo-box{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  width:26px;height:26px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;font-size:13px;box-shadow:0 0 16px rgba(61,127,255,.35);flex-shrink:0;
}

/* search */
.search-wrap{flex:1;max-width:420px;position:relative}
.search-inp{
  width:100%;background:rgba(14,22,40,.7);border:1px solid var(--border);
  border-radius:24px;padding:8px 18px 8px 40px;font-size:13px;color:var(--text);
  outline:none;transition:all .2s;backdrop-filter:blur(8px);
}
.search-inp:focus{border-color:var(--accent);background:rgba(14,22,40,.9);box-shadow:0 0 0 3px rgba(61,127,255,.1)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--muted)}

/* ── BUTTONS ──────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;gap:6px;border:none;
  border-radius:12px;padding:9px 18px;font-size:13px;color:#fff;
  font-weight:600;letter-spacing:.2px;white-space:nowrap;
}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn:active{transform:scale(.96) translateY(0)}
.btn-sm{padding:7px 14px;font-size:12px;border-radius:10px}
.btn-xs{padding:4px 10px;font-size:11px;border-radius:7px;font-weight:600}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 18px rgba(61,127,255,.3)}
.btn-s{background:rgba(61,127,255,.12);color:var(--accent);border:1px solid rgba(61,127,255,.2)}
.btn-s:hover{background:rgba(61,127,255,.2)}
.btn-g{background:rgba(0,232,122,.12);color:var(--green);border:1px solid rgba(0,232,122,.2)}
.btn-r{background:rgba(255,77,106,.12);color:var(--red);border:1px solid rgba(255,77,106,.15)}
.ghost{
  background:transparent;border:1px solid var(--border2);border-radius:12px;
  padding:7px 16px;font-size:13px;color:var(--muted);
}
.ghost:hover{border-color:var(--border3);color:var(--text);background:rgba(255,255,255,.03)}
.ibtn{
  background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:10px;
  padding:6px 10px;font-size:15px;color:var(--muted);display:inline-flex;align-items:center;
  backdrop-filter:blur(4px);
}
.ibtn:hover{border-color:var(--border2);color:var(--text);background:rgba(255,255,255,.07)}

/* ── FORM ──────────────────────────────────── */
.inp{
  width:100%;background:rgba(14,22,40,.8);border:1px solid var(--border);
  border-radius:var(--rs);padding:9px 14px;font-size:13px;color:var(--text);
  outline:none;transition:all .18s;
}
.inp:focus{border-color:var(--accent);background:rgba(14,22,40,.95);box-shadow:0 0 0 3px rgba(61,127,255,.08)}
.lbl{font-size:11px;color:var(--muted);margin-bottom:6px;display:block;font-weight:600;letter-spacing:.8px;text-transform:uppercase}
.form-group{margin-bottom:16px}

/* ── LAYOUT ──────────────────────────────────── */
#app{display:flex;flex-direction:column;min-height:100vh}
#main{flex:1;max-width:700px;width:100%;margin:0 auto;padding:24px 20px 110px}
.feed-layout{display:grid;grid-template-columns:1fr 310px;gap:24px;max-width:1060px;margin:0 auto;padding:24px 20px 110px}

/* ── NOTE CARD (Feed) ──────────────────────────── */
.note-card{
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  margin-bottom:16px;overflow:hidden;transition:all .22s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.note-card::before{
  content:'';position:absolute;inset:0;border-radius:20px;
  background:linear-gradient(135deg,rgba(61,127,255,.03),transparent 60%);
  pointer-events:none;
}
.note-card:hover{
  border-color:var(--border2);
  transform:translateY(-2px);
  box-shadow:0 12px 40px rgba(0,0,0,.35),var(--glow);
}

.nc-header{padding:16px 18px 10px;display:flex;align-items:center;gap:11px}
.avatar{
  width:40px;height:40px;border-radius:50%;object-fit:cover;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:700;color:#fff;flex-shrink:0;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 4px 14px rgba(61,127,255,.3);
  transition:transform .18s;
}
.avatar:hover{transform:scale(1.08)}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.nc-user{flex:1;min-width:0}
.nc-username{
  font-size:13px;font-weight:600;color:var(--text);cursor:pointer;
  transition:color .15s;
}
.nc-username:hover{color:var(--accent)}
.nc-meta{font-size:11px;color:var(--muted);margin-top:1px}
.nc-subject{
  border-radius:20px;padding:3px 11px;font-size:11px;font-weight:700;
  letter-spacing:.3px;white-space:nowrap;
}
.nc-body{padding:2px 18px 12px}
.nc-title{
  font-family:var(--serif);font-size:19px;font-style:italic;color:#eef3ff;
  margin-bottom:7px;cursor:pointer;transition:color .15s;line-height:1.35;font-weight:400;
}
.nc-title:hover{color:var(--accent)}
.nc-content{
  font-size:13px;color:var(--muted);line-height:1.75;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.nc-images{display:grid;gap:3px;margin:10px 0;border-radius:12px;overflow:hidden}
.nc-images.one img{width:100%;height:220px;object-fit:cover;cursor:zoom-in;transition:transform .3s}
.nc-images.one img:hover{transform:scale(1.01)}
.nc-images.two{grid-template-columns:1fr 1fr}
.nc-images.two img,.nc-images.three img{height:160px;object-fit:cover;cursor:zoom-in;width:100%;transition:transform .3s}
.nc-images.two img:hover,.nc-images.three img:hover{transform:scale(1.02)}
.nc-images.three{grid-template-columns:1fr 1fr}
.nc-images.three .img-main{grid-column:1/-1}
.nc-images.three .img-main img{height:190px}
.nc-tags{padding:0 18px 10px;display:flex;gap:5px;flex-wrap:wrap}
.nc-tag{
  background:rgba(61,127,255,.08);color:var(--muted);border-radius:20px;
  padding:3px 10px;font-size:11px;border:1px solid rgba(61,127,255,.1);
  transition:all .15s;cursor:pointer;
}
.nc-tag:hover{color:var(--accent);border-color:rgba(61,127,255,.3)}
.nc-actions{
  padding:10px 18px 16px;display:flex;align-items:center;gap:4px;
  border-top:1px solid rgba(20,36,58,.6);
}
.action-btn{
  display:flex;align-items:center;gap:5px;background:transparent;border:none;
  color:var(--muted);font-size:12px;font-family:var(--font);padding:6px 10px;
  border-radius:10px;transition:all .15s;font-weight:500;
}
.action-btn:hover{background:rgba(255,255,255,.05);color:var(--text)}
.action-btn.liked{color:var(--red)}
.action-btn.bookmarked{color:var(--amber)}
.ai{font-size:16px}
.action-sep{flex:1}

/* ── FILTER CHIPS ──────────────────────────── */
.filter-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-bottom:18px}
.filter-row::-webkit-scrollbar{display:none}
.fchip{
  background:rgba(14,22,40,.8);border:1px solid var(--border);border-radius:24px;
  padding:6px 16px;font-size:12px;font-weight:500;color:var(--muted);
  cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .18s;
  backdrop-filter:blur(8px);
}
.fchip:hover{border-color:var(--border2);color:var(--text)}
.fchip.on{
  background:linear-gradient(135deg,rgba(61,127,255,.2),rgba(108,63,255,.15));
  border-color:rgba(61,127,255,.4);color:#7ab8ff;font-weight:600;
  box-shadow:0 0 14px rgba(61,127,255,.12);
}

/* ── SIDEBAR ──────────────────────────────── */
.sidebar{position:sticky;top:78px;height:fit-content}
.sb-card{
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:18px;margin-bottom:16px;backdrop-filter:blur(8px);
}
.sb-title{
  font-family:var(--serif);font-size:15px;font-style:italic;font-weight:400;
  color:#eef3ff;margin-bottom:14px;padding-bottom:10px;
  border-bottom:1px solid var(--border);
}
.sb-user{display:flex;align-items:center;gap:11px;margin-bottom:12px;cursor:pointer;padding:6px;border-radius:12px;transition:background .15s}
.sb-user:hover{background:rgba(255,255,255,.04)}
.sb-uname{font-size:13px;font-weight:600;color:var(--text);transition:color .15s}
.sb-user:hover .sb-uname{color:var(--accent)}
.sb-umeta{font-size:11px;color:var(--muted)}

/* ── AUTH ──────────────────────────────────── */
.auth-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:
    radial-gradient(ellipse 70% 60% at 10% 20%,rgba(61,127,255,.1) 0%,transparent 60%),
    radial-gradient(ellipse 50% 50% at 90% 80%,rgba(108,63,255,.08) 0%,transparent 60%);
}
.auth-box{
  background:rgba(11,17,32,.9);border:1px solid var(--border2);border-radius:24px;
  padding:36px;width:100%;max-width:420px;
  box-shadow:0 24px 80px rgba(0,0,0,.5),var(--glow);
  backdrop-filter:blur(20px);
}
.auth-tabs{display:flex;gap:0;background:rgba(8,13,24,.8);border-radius:12px;padding:4px;margin-bottom:22px;border:1px solid var(--border)}
.auth-tab{flex:1;padding:9px;border:none;background:transparent;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);transition:all .2s;font-family:var(--font)}
.auth-tab.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 14px rgba(61,127,255,.3)}

/* ── PROFILE ──────────────────────────────── */
.profile-header{
  background:linear-gradient(180deg,rgba(11,17,32,.95) 0%,rgba(8,13,24,.98) 100%);
  border-bottom:1px solid var(--border);padding:28px 20px 20px;
  position:relative;overflow:hidden;
}
.profile-header::before{
  content:'';position:absolute;top:-60px;right:-60px;
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(61,127,255,.1),transparent 70%);
  pointer-events:none;
}
.profile-av{
  width:88px;height:88px;border-radius:50%;object-fit:cover;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:700;color:#fff;margin-bottom:14px;
  box-shadow:0 8px 30px rgba(61,127,255,.35);border:3px solid rgba(61,127,255,.3);
}
.profile-name{font-family:var(--serif);font-size:26px;font-style:italic;color:#eef3ff;margin-bottom:4px;font-weight:400}
.profile-stats{display:flex;gap:24px;margin-top:14px}
.pstat{text-align:center;cursor:pointer;transition:transform .15s}
.pstat:hover{transform:translateY(-2px)}
.pstat-v{font-size:20px;font-weight:700;color:#eef3ff;font-family:var(--serif)}
.pstat-l{font-size:11px;color:var(--muted);margin-top:2px;font-weight:500;letter-spacing:.3px}

/* ── NOTE DETAIL ──────────────────────────── */
.nd-title{
  font-family:var(--serif);font-size:28px;font-style:italic;color:#eef3ff;
  margin-bottom:10px;font-weight:400;line-height:1.3;
}
.nd-content{font-size:14px;color:#c5d5f0;line-height:1.95;white-space:pre-wrap;word-break:break-word}

/* comment */
.comment-item{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid rgba(20,36,58,.5)}
.ci-text{font-size:13px;color:var(--text);line-height:1.65}
.ci-meta{font-size:11px;color:var(--muted);margin-top:3px}

/* ── CREATE ──────────────────────────────── */
.create-wrap{max-width:700px;margin:0 auto;padding:24px 20px 110px}
.create-card{
  background:var(--card);border:1px solid var(--border);border-radius:22px;padding:24px;
  box-shadow:0 8px 40px rgba(0,0,0,.2);
}
.create-title{font-family:var(--serif);font-size:22px;font-style:italic;color:#eef3ff;margin-bottom:22px;font-weight:400}
.note-textarea{
  width:100%;background:rgba(8,13,24,.7);border:1px solid var(--border);
  border-radius:12px;padding:16px;font-size:14px;color:var(--text);line-height:1.85;
  resize:none;outline:none;min-height:220px;font-family:var(--font);transition:all .2s;
}
.note-textarea:focus{border-color:var(--accent);background:rgba(8,13,24,.9);box-shadow:0 0 0 3px rgba(61,127,255,.08)}
.img-preview-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.img-prev-item{position:relative;width:86px;height:70px}
.img-prev-item img{width:100%;height:100%;object-fit:cover;border-radius:9px;border:1px solid var(--border)}
.img-rm{position:absolute;top:-5px;right:-5px;background:var(--red);border:none;border-radius:50%;width:18px;height:18px;color:#fff;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(255,77,106,.4)}

/* ── COMM CARDS ──────────────────────────── */
.comm-card{
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  margin-bottom:16px;overflow:hidden;transition:all .22s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.comm-card::before{
  content:'';position:absolute;inset:0;border-radius:20px;
  background:linear-gradient(135deg,rgba(61,127,255,.02),transparent 50%);
  pointer-events:none;
}
.comm-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,.3),var(--glow)}
.comm-header{padding:16px 18px 10px;display:flex;align-items:center;gap:11px}
.comm-avatar{
  width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;
  box-shadow:0 4px 14px rgba(0,0,0,.3);
}
.comm-user{flex:1;min-width:0}
.comm-username{font-size:13px;font-weight:600;color:var(--text)}
.comm-meta{font-size:11px;color:var(--muted);margin-top:1px}
.comm-body{padding:0 18px 12px;cursor:pointer}
.comm-title{
  font-family:var(--serif);font-size:18px;font-style:italic;color:#eef3ff;
  margin-bottom:7px;transition:color .15s;font-weight:400;line-height:1.35;
}
.comm-body:hover .comm-title{color:var(--accent)}
.comm-content{font-size:13px;color:var(--muted);line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.comm-footer{
  padding:10px 18px 16px;display:flex;align-items:center;gap:4px;
  border-top:1px solid rgba(20,36,58,.5);
}
.comm-tag{
  background:rgba(61,127,255,.08);color:var(--muted);border-radius:20px;
  padding:3px 10px;font-size:11px;border:1px solid rgba(61,127,255,.1);
}
.comm-likes{
  display:flex;align-items:center;gap:5px;background:transparent;border:none;
  color:var(--muted);font-size:12px;font-family:var(--font);padding:6px 10px;
  border-radius:10px;transition:all .15s;font-weight:500;cursor:pointer;
}
.comm-likes:hover{background:rgba(255,255,255,.05);color:var(--text)}
.comm-likes.liked{color:var(--red)}

/* ── MODAL ──────────────────────────────── */
.pub-modal{
  background:rgba(11,17,32,.97);border:1px solid var(--border2);border-radius:22px;
  padding:24px;width:100%;max-width:440px;max-height:85vh;overflow-y:auto;
  box-shadow:0 32px 80px rgba(0,0,0,.6),var(--glow);
  backdrop-filter:blur(24px);
}
.ovl{position:fixed;inset:0;background:rgba(2,5,12,.75);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.mdl{background:rgba(11,17,32,.97);border:1px solid var(--border2);border-radius:20px;padding:24px;width:100%;max-width:340px;box-shadow:0 24px 60px rgba(0,0,0,.5);backdrop-filter:blur(20px)}

.top-r{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0}

/* ── CHAT ──────────────────────────────────── */
#chat-msgs::-webkit-scrollbar{width:4px}
#chat-msgs::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
#chat-msgs{scrollbar-width:thin;scrollbar-color:var(--border2) transparent}

/* ── DESKTOP NAV ──────────────────────────── */
#desktop-nav{
  display:flex;align-items:center;gap:4px;flex:1;justify-content:center;
}
.nb{
  background:transparent;border:none;border-radius:12px;
  padding:7px 14px;font-size:13px;color:var(--muted);
  font-weight:500;cursor:pointer;transition:all .18s;
  font-family:var(--font);position:relative;
  display:flex;align-items:center;gap:5px;
}
.nb:hover{background:rgba(255,255,255,.05);color:var(--text)}
.nb.on{
  background:rgba(61,127,255,.12);color:var(--accent);
  font-weight:600;
}
@media(max-width:700px){
  #desktop-nav{display:none!important}
}

/* ── MOBILE NAV ──────────────────────────── */
#mbar{
  display:none;position:fixed;bottom:0;left:0;right:0;
  background:rgba(8,13,24,.95);border-top:1px solid rgba(20,36,58,.8);
  padding:8px 0 max(8px,env(safe-area-inset-bottom));
  z-index:300;justify-content:space-around;align-items:center;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
}
.mb{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--muted);padding:4px 14px;font-size:10px;font-weight:500;transition:all .18s;letter-spacing:.3px}
.mb .mi{font-size:20px;line-height:1;transition:transform .18s}
.mb.on{color:var(--accent)}
.mb.on .mi{transform:translateY(-1px)}
#fab{
  position:fixed;bottom:78px;right:18px;z-index:400;width:54px;height:54px;
  border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;font-size:22px;color:#fff;display:none;box-shadow:0 6px 24px rgba(61,127,255,.5);

}

/* ── TOAST ──────────────────────────────── */

/* ── STAT CARD ──────────────────────────── */

/* ── SECTION TITLE ──────────────────────── */
.stitle{

}

/* ── PBAR ──────────────────────────────── */

}

/* ── PROGRESS BADGE ──────────────────────── */

.sc{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:10px}

/* ── EDITOR ──────────────────────────────── */
.ewrap{display:grid;grid-template-columns:1fr 290px;gap:16px;min-height:calc(100vh - 130px)}

.fmt-btn:hover{background:rgba(255,255,255,.07);color:var(--text)}

/* ── RICH EDITOR ──────────────────────────── */
.rich-editor{flex:1;outline:none;padding:20px 22px;font-size:14px;color:#d8e8ff;line-height:1.95;overflow-y:auto;font-family:var(--font);min-height:200px;word-break:break-word}

.rich-editor h1{font-family:var(--serif);font-size:24px;font-style:italic;color:#eef3ff;margin:14px 0 7px;border-bottom:1px solid var(--border);padding-bottom:8px;font-weight:400}
.rich-editor h2{font-family:var(--serif);font-size:20px;color:#eef3ff;margin:12px 0 6px;font-weight:400;font-style:italic}
.rich-editor h3{font-size:16px;font-weight:700;color:#c5d5f0;margin:10px 0 5px;letter-spacing:.2px}
.rich-editor strong,.rich-editor b{color:#fff;font-weight:700}

.rich-editor pre{background:rgba(4,7,13,.8);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:10px 0;overflow-x:auto;border-left:3px solid var(--accent)}

.rich-editor ul{padding-left:22px;margin:8px 0}
.rich-editor ol{padding-left:22px;margin:8px 0}
.rich-editor li{margin:4px 0;color:#c5d5f0}

.rich-editor hr{border:none;border-top:1px solid var(--border);margin:14px 0}

.rich-editor td,.rich-editor th{border:1px solid var(--border);padding:8px 12px;font-size:13px}
.rich-editor th{background:rgba(61,127,255,.1);color:#7ab8ff;font-weight:700;font-size:12px;letter-spacing:.5px}
.rich-editor img{max-width:100%;border-radius:10px;margin:8px 0}
.wc-bar{padding:7px 18px;font-size:11px;color:var(--muted);border-top:1px solid rgba(20,36,58,.5);display:flex;gap:16px;flex-wrap:wrap;align-items:center}

/* ── SPACED REPETITION ──────────────────── */
.sr-btn{display:flex;flex-direction:column;align-items:center;gap:4px;border:none;border-radius:14px;padding:12px 20px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .2s;flex:1}

.sr-hard{background:rgba(255,77,106,.15);color:var(--red);border:1px solid rgba(255,77,106,.25)}

.flip-card{perspective:1000px;cursor:pointer}
.flip-inner{position:relative;width:100%;transition:transform .55s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;min-height:220px}
.flip-inner.flipped{transform:rotateY(180deg)}
.flip-front,.flip-back{position:absolute;width:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:36px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:220px}

/* ── READ MODE ──────────────────────────── */
.read-mode-wrap{position:fixed;inset:0;background:var(--bg);z-index:600;overflow-y:auto;padding:0}

.gsearch-overlay{position:fixed;inset:0;background:rgba(2,5,12,.8);z-index:700;display:flex;align-items:flex-start;justify-content:center;padding-top:100px;backdrop-filter:blur(16px)}
.gsearch-box{background:rgba(11,17,32,.98);border:1px solid var(--border2);border-radius:20px;width:100%;max-width:600px;overflow:hidden;box-shadow:0 28px 70px rgba(0,0,0,.65),var(--glow);backdrop-filter:blur(24px)}

.gsearch-result{display:flex;align-items:center;gap:11px;padding:12px 18px;cursor:pointer;transition:background .15s;border-bottom:1px solid rgba(20,36,58,.4)}

.gsearch-result:last-child{border-bottom:none}
.gsearch-hl{color:var(--accent);font-weight:700}

.skeleton{background:linear-gradient(90deg,var(--card) 25%,rgba(30,52,82,.4) 50%,var(--card) 75%);background-size:200% 100%;animation:shimmer 1.8s infinite;border-radius:var(--rs)}

.sk-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:16px}

/* ── NOTIF DOT ──────────────────────────── */
.notif-dot{width:8px;height:8px;background:var(--red);border-radius:50%;position:absolute;top:-2px;right:-2px;box-shadow:0 0 8px rgba(255,77,106,.6)}

/* ── EMPTY STATE ──────────────────────── */
.empty{text-align:center;padding:70px 20px}
.empty-icon{font-size:52px;margin-bottom:16px;filter:grayscale(.3)}

/* ── PRINT ──────────────────────────────── */
@media print{

.cdot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0}

#autosave-bar{position:fixed;top:54px;left:0;right:0;height:2px;background:transparent;z-index:190;transition:background .3s}

function initFirebase() {
  try {

        firebase.initializeApp(firebaseConfig);
      }

async function initAndStart() {

  if (_authReady) {

  // DB uchun kutamiz

let currentGoogleUser = null;

function initGoogleAuth() {
  if (!_authReady || !auth) return;
  auth.onAuthStateChanged(user => {
    currentGoogleUser = user;
    updateAuthUI(user);
    if (user) {
      currentProfile = {
        ...(currentProfile || {}),
        name: user.displayName || currentProfile?.name || 'Anonim',
        email: user.email,
        photo: user.photoURL,
        uid: user.uid
      };
      localStorage.setItem('nn4_profile', JSON.stringify(currentProfile));
    }
  });
}

function updateAuthUI(user) {
  const label = document.getElementById('auth-label');
  const avatarWrap = document.getElementById('auth-avatar');
  const photo = document.getElementById('auth-photo');
  if (!label) return;
  if (user) {
    label.textContent = user.displayName?.split(' ')[0] || 'Profil';
    if (user.photoURL && avatarWrap && photo) {
      photo.src = user.photoURL;
      avatarWrap.style.display = 'block';
    }
    // Xabar badge yangilash
    setTimeout(updateMsgBadge, 500);
  } else {
    label.textContent = '🔐 Kirish';
    if (avatarWrap) avatarWrap.style.display = 'none';
    ['msg-badge-d','msg-badge-m'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    });
  }
}

function handleAuthClick() {
  if (currentGoogleUser) {
    go('profile');
  } else {
    signInWithGoogle();

}

async function signInWithGoogle() {
  if (!_authReady || !auth) { 
    toast("Firebase Auth yuklanmadi. Sahifani qayta yuklang.", 'err'); 
    return; 
  }
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.addScope('profile');
    provider.addScope('email');
    provider.setCustomParameters({ prompt: 'select_account' });
    await auth.signInWithPopup(provider);
    toast("✅ Muvaffaqiyatli kirdingiz!");
    const pop = document.getElementById('user-menu-pop');
    if (pop) pop.remove();
  } catch(e) {
    console.error('Auth xato:', e);
    if (e.code === 'auth/popup-closed-by-user') return;
    if (e.code === 'auth/configuration-not-found' || e.code === 'auth/operation-not-allowed') {
      showAuthSetupModal();
    } else if (e.code === 'auth/unauthorized-domain') {
      showAuthSetupModal('domain');
    } else {
      toast("Xato: " + (e.code || e.message), 'err');
    }
  }
}

  const steps = type === 'domain' ? `

      <div style="font-size:12px;color:var(--muted);line-height:1.8">
        <b style="color:#ecf2ff">1.</b> <a href="https://console.firebase.google.com" target="_blank" style="color:var(--accent)">Firebase Console</a> → <b>mednotepad-b8f74</b><br>
        <b style="color:#ecf2ff">2.</b> <b>Authentication</b> → <b>Settings</b><br>
        <b style="color:#ecf2ff">3.</b> <b>Authorized domains</b> → <b>Add domain</b><br>
        <b style="color:#ecf2ff">4.</b> <code style="background:rgba(0,0,0,.4);padding:2px 6px;border-radius:4px">medsee.github.io</code> kiriting → <b>Add</b>
      </div>
    </div>` : `
    <div style="font-size:14px;font-weight:700;color:#ecf2ff;margin-bottom:12px">🔧 Firebase Authentication sozlanmagan</div>
    <div style="background:rgba(61,127,255,.08);border:1px solid rgba(61,127,255,.2);border-radius:12px;padding:14px;margin-bottom:14px">
      <div style="font-size:12px;color:var(--muted);line-height:2">
        <b style="color:#ecf2ff">1.</b> <a href="https://console.firebase.google.com/project/mednotepad-b8f74/authentication" target="_blank" style="color:var(--accent)">Firebase Console → Authentication</a> oching<br>
        <b style="color:#ecf2ff">2.</b> <b>"Get started"</b> tugmasini bosing<br>
        <b style="color:#ecf2ff">3.</b> <b>Sign-in method</b> → <b>Google</b> tanlang<br>
        <b style="color:#ecf2ff">4.</b> <b>Enable</b> qilib, email tanlang → <b>Save</b><br>
        <b style="color:#ecf2ff">5.</b> <b>Settings → Authorized domains</b> → <code style="background:rgba(0,0,0,.4);padding:2px 6px;border-radius:4px">medsee.github.io</code> qo'shing
      </div>
    </div>`;

  overlay.innerHTML = `
  <div style="background:#0e1520;border:1px solid #253045;border-radius:20px;padding:24px;width:100%;max-width:440px">
    <div style="font-size:32px;text-align:center;margin-bottom:14px">⚙️</div>
    <div style="font-size:17px;font-weight:700;color:#ecf2ff;text-align:center;margin-bottom:6px">Firebase sozlash kerak</div>
    <div style="font-size:12px;color:var(--muted);text-align:center;margin-bottom:18px">Bir martalik sozlash, 2 daqiqa</div>
    ${steps}
    <div style="background:rgba(240,165,0,.08);border:1px solid rgba(240,165,0,.15);border-radius:10px;padding:10px;margin-bottom:16px;font-size:12px;color:var(--amber)">
      💡 Sozlagandan so'ng sahifani yangilang va qayta kirish tugmasini bosing
    </div>
    <div style="display:flex;gap:8px">
      <button onclick="document.getElementById('auth-setup-overlay').style.display='none'" style="flex:1;background:transparent;border:1px solid var(--border2);border-radius:12px;padding:10px;font-size:13px;color:var(--muted);cursor:pointer;font-family:var(--font)">Yopish</button>
      <a href="https://console.firebase.google.com/project/mednotepad-b8f74/authentication" target="_blank" style="flex:1;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:12px;padding:10px;font-size:13px;color:#fff;cursor:pointer;font-family:var(--font);font-weight:600;text-decoration:none;display:flex;align-items:center;justify-content:center">🔗 Firebase ochish</a>
    </div>
  </div>`;
}

// ── Firebase Community Functions ──────────────────

async function getCommunityFromDB() {
  if (!_firebaseReady || !db) return getCommunity();
  try {
    const snap = await db.ref('community').orderByChild('publishedAt').limitToLast(100).get();
    if (!snap.exists()) return []; // Firebase ulangan lekin bo'sh — [] qaytaradi
    const data = snap.val();
    const list = Object.values(data).sort((a,b) => b.publishedAt - a.publishedAt);
    // Sync to localStorage for offline use
    saveCommunity(list);
    return list;
  } catch(e) {
    console.error('Firebase read xato:', e);
    return getCommunity(); // offline fallback
  }
}

async function saveToDB(note) {
  if (!_firebaseReady || !db) return false;
  try {
    await db.ref('community/' + note.id).set(note);
    return true;
  } catch(e) {
    console.error('Firebase write xato:', e);
    return false;
  }
}

async function deleteFromDB(noteId) {
  if (!_firebaseReady || !db) return false;
  try {
    await db.ref('community/' + noteId).remove();
    return true;
  } catch(e) {
    console.error('Firebase delete xato:', e);
    return false;
  }
}

async function updateLikeInDB(noteId, likes) {
  if (!_firebaseReady || !db) return;
  try { await db.ref('community/' + noteId + '/likes').set(likes); } catch(e) {}
}

async function updateViewsInDB(noteId, views) {
  if (!_firebaseReady || !db) return;
  try { await db.ref('community/' + noteId + '/views').set(views); } catch(e) {}
}

async function saveCommentToDB(noteId, comment) {
  if (!_firebaseReady || !db) return false;
  try {
    await db.ref('comments/' + noteId + '/' + comment.id).set(comment);
    const snap = await db.ref('comments/' + noteId).get();
    const count = snap.exists() ? Object.keys(snap.val()).length : 1;
    await db.ref('community/' + noteId + '/commentsCount').set(count);
    return true;
  } catch(e) {
    console.error('Comment save xato:', e);
    return false;
  }
}

async function getCommentsFromDB(noteId) {
  if (!_firebaseReady || !db) return getComments(noteId);
  try {
    const snap = await db.ref('comments/' + noteId).get();
    if (!snap.exists()) return getComments(noteId);
    return Object.values(snap.val()).sort((a,b) => a.ts - b.ts);
  } catch(e) {
    return getComments(noteId);
  }
}

// Real-time listener for community feed
let _commListener = null;
function startCommListener() {
  if (!_firebaseReady || !db || _commListener) return;
  _commListener = db.ref('community').orderByChild('publishedAt').limitToLast(100);
  _commListener.on('value', (snap) => {
    let list = [];
    if (snap.exists()) {
      const data = snap.val();
      list = Object.values(data).sort((a,b) => b.publishedAt - a.publishedAt);
      saveCommunity(list);
    } else {
      saveCommunity([]);
    }
    // Auto-update UI if on comm page
    if (view === 'comm') {
      const commList = document.getElementById('comm-list');
      if (commList) {
        if (!list.length) {
          commList.innerHTML = `<div style="text-align:center;padding:60px 16px">
            <div style="font-size:52px;margin-bottom:14px">📭</div>
            <div style="font-size:18px;font-weight:700;color:#4a6080;margin-bottom:8px">Hali konspekt yo'q</div>
            <div style="font-size:13px;color:var(--dim);margin-bottom:18px">Birinchi bo'lib o'z konspektingizni ulashing!</div>
            <button class="btn btn-p" onclick="showPublishPicker()">📤 Konspekt ulashish</button>
          </div>`;
        } else {
          commList.innerHTML = list.map(n => commCardHTML(n)).join('');
        }
        // Update count in header
        const subtitle = document.querySelector('#main div[style*="font-size:13px"][style*="color:var(--muted)"]');
        if (subtitle) {
          subtitle.innerHTML = `${list.length} ta konspekt ulashilgan <span style="font-size:11px;color:var(--green)">🔥 Firebase ulangan</span>`;
        }
      }
    }
  });

  // Also listen for errors
  _commListener.on('cancel', (err) => {
    console.error('Firebase listener xato:', err);
  });
}

let _autosaveTimer=null;
let _lastSavedContent='';
let _lastSavedTitle='';
let _autoSaveInterval=null;

function saveNote(silent){
  if(!editing)return;
  editing.updatedAt=Date.now();
  const i=notes.findIndex(x=>x.id===editing.id);
  if(i>=0)notes[i]={...editing};
  save();
  _lastSavedContent=editing.content||'';
  _lastSavedTitle=editing.title||'';
  // clear draft
  localStorage.removeItem('nn4_draft_'+editing.id);
  if(!silent){
    toast('Saqlandi ✓');
    showSaveBar('saved');
  }
  showHint('saved');
  updateSaveBtn(false);
}

function autoSave(){
  if(!editing)return;
  const re=document.getElementById('rich-ed');
  if(re&&!_srcMode)editing.content=re.innerHTML;
  const changed=(editing.content||'')!==_lastSavedContent||(editing.title||'')!==_lastSavedTitle;
  if(!changed)return;
  showSaveBar('saving');
  showHint('saving');
  setTimeout(()=>{
    editing.updatedAt=Date.now();
    const i=notes.findIndex(x=>x.id===editing.id);
    if(i>=0)notes[i]={...editing};
    save();
    _lastSavedContent=editing.content||'';
    _lastSavedTitle=editing.title||'';
    showSaveBar('saved');
    showHint('saved');
    updateSaveBtn(false);
  },300);
}

function showSaveBar(state){
  const bar=document.getElementById('autosave-bar');
  if(!bar)return;
  bar.className='';
  void bar.offsetWidth;
  bar.className=state;
}

function showHint(state){
  const hint=document.getElementById('autosave-hint');
  if(!hint)return;
  if(state==='unsaved'){
    hint.innerHTML=`<span class="dot" style="background:var(--amber)"></span>Saqlanmagan o'zgarishlar...`;
    hint.classList.add('show');
  } else if(state==='saving'){
    hint.innerHTML=`<span class="dot" style="background:var(--accent)"></span>Saqlanmoqda...`;
    hint.classList.add('show');
  } else if(state==='saved'){
    hint.innerHTML=`<span class="dot" style="background:var(--green)"></span>Avtomatik saqlandi ✓`;
    hint.classList.add('show');
    clearTimeout(window._hintT);
    window._hintT=setTimeout(()=>hint.classList.remove('show'),2000);
  }
}

function updateSaveBtn(unsaved){
  const btn=document.getElementById('save-btn');
  if(!btn)return;
  if(unsaved){
    btn.style.background='var(--amber)';
    btn.textContent='● Saqlash';
  } else {
    btn.style.background='var(--accent)';
    btn.textContent='💾 Saqlandi';
  }
}

function gf(){
  return notes.filter(n=>{
    const q=sq.toLowerCase();
    const ms=!q||[n.title,n.content,n.subject,...(n.tags||[])].some(t=>(t||'').toLowerCase().includes(q));
    const mj=fsubj==='all'||n.subject===fsubj;
    const mc=fcol==='all'||n.color===fcol;
    return ms&&mj&&mc;
  }).sort((a,b)=>{
    if(a.pinned!==b.pinned)return a.pinned?-1:1;
    if(sort==='date')return b.updatedAt-a.updatedAt;
    if(sort==='title')return(a.title||'').localeCompare(b.title||'');
    if(sort==='words')return wc(b.content)-wc(a.content);
    return 0;
  });
}

// ── IMAGE COMPRESS ──────────────────────────────────────────────
const IMG_MAX_W = 1200;   // max width px
const IMG_MAX_H = 1200;   // max height px
const IMG_QUALITY = 0.75; // JPEG quality
const IMG_MAX_KB = 300;   // max KB per image

function formatBytes(bytes){
  if(bytes<1024)return bytes+'B';
  if(bytes<1024*1024)return (bytes/1024).toFixed(1)+'KB';
  return (bytes/1024/1024).toFixed(1)+'MB';
}

function base64Size(b64){ return Math.round((b64.length*3/4)/1024); }

function compressImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        let {width:w, height:h} = img;
        // Scale down if needed
        const ratio = Math.min(IMG_MAX_W/w, IMG_MAX_H/h, 1);
        w = Math.round(w*ratio);
        h = Math.round(h*ratio);

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);

        // Try different qualities until under limit
        let quality = IMG_QUALITY;
        let url = canvas.toDataURL('image/jpeg', quality);
        while(base64Size(url) > IMG_MAX_KB && quality > 0.3){
          quality -= 0.1;
          url = canvas.toDataURL('image/jpeg', quality);
        }

        const origKB = Math.round(file.size/1024);
        const newKB = base64Size(url);
        resolve({
          id: uid(),
          url,
          name: file.name,
          ts: Date.now(),
          origSize: origKB,
          size: newKB,
          width: w,
          height: h,
          compressed: origKB > newKB
        });
      };
      img.onerror = () => resolve(null);
      img.src = ev.target.result;
    };
    reader.onerror = () => resolve(null);
    reader.readAsDataURL(file);
  });
}

function checkStorageQuota(){
  try{
    const total = JSON.stringify(notes).length + JSON.stringify(customSubj).length;
    const totalKB = Math.round(total/1024);
    const limitKB = 4500; // safe limit ~4.5MB of 5MB
    return { used: totalKB, limit: limitKB, pct: Math.round(totalKB/limitKB*100) };
  }catch(e){ return {used:0,limit:4500,pct:0}; }
}

async function addImgs(e){
  const files = Array.from(e.target.files);
  if(!files.length)return;

  // Show loading state
  const btn = document.querySelector('#imginp+button') || document.querySelector('[onclick*="imginp"]');
  const origText = btn?.textContent;
  if(btn){ btn.textContent='⏳ Siqilmoqda...'; btn.disabled=true; }

  let successCount = 0;
  let savedKB = 0;

  for(const file of files){
    // Check storage before adding
    const quota = checkStorageQuota();
    if(quota.pct >= 90){
      toast(`⚠️ Xotira ${quota.pct}% to'lgan! Rasm siqilmadi.`, 'err');
      break;
    }

    const compressed = await compressImage(file);
    if(!compressed){ toast(`Rasm o'qilmadi: ${file.name}`, 'err'); continue; }

    editing.images = [...(editing.images||[]), compressed];
    savedKB += (compressed.origSize - compressed.size);
    successCount++;
  }

  rfImgs();
  updateStorageBar();

  if(btn){ btn.textContent = origText||'📷 Rasm yuklash'; btn.disabled=false; }

  if(successCount > 0){
    const msg = savedKB > 10
      ? `📸 ${successCount} rasm yuklandi · ${savedKB}KB tejlandi ✓`
      : `📸 ${successCount} rasm yuklandi ✓`;
    toast(msg);
  }
  e.target.value='';
}

function updateStorageBar(){
  const bar = document.getElementById('storage-bar-fill');
  const label = document.getElementById('storage-bar-label');
  if(!bar||!label)return;
  const q = checkStorageQuota();
  const color = q.pct>80?'var(--red)':q.pct>60?'var(--amber)':'var(--green)';
  bar.style.width = Math.min(q.pct,100)+'%';
  bar.style.background = color;
  label.textContent = `Xotira: ${q.used}KB / ${q.limit}KB (${q.pct}%)`;
  label.style.color = q.pct>80?'var(--red)':q.pct>60?'var(--amber)':'var(--muted)';
}
function rmImg(id){editing.images=(editing.images||[]).filter(i=>i.id!==id);rfImgs();}
function rfImgs(){
  const row=document.getElementById('imgrow');if(!row)return;
  const imgs=editing.images||[];
  row.style.display=imgs.length?'flex':'none';
  row.innerHTML=imgs.map(img=>`<div style="position:relative;flex-shrink:0;text-align:center">

  updateStorageBar();
}

function rFlash(){

  const due=allDeck.filter(n=>(srData[n.id]?.nextReview||0)<=now);
  const notDue=allDeck.filter(n=>(srData[n.id]?.nextReview||0)>now);
  const deck=[...due,...notDue];
  const learned=allDeck.filter(n=>srData[n.id]?.ease).length;
  const dueCount=due.length;
  const easyCount=allDeck.filter(n=>srData[n.id]?.ease==='easy').length;
  if(!deck.length){
    document.getElementById('main').innerHTML=`<div style="text-align:center;padding:70px 16px">
      <div style="font-size:48px;margin-bottom:12px">🃏</div>
      <div style="color:var(--dim);font-size:15px;margin-bottom:16px">Flashcard uchun konspekt kerak</div>
      <button class="btn btn-p" onclick="newNote()">+ Konspekt yaratish</button></div>`;
    return;
  }
  const idx=fi%deck.length,n=deck[idx];

  document.getElementById('main').innerHTML=`
  <div style="max-width:580px;margin:0 auto">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">

        ?`<span class="sr-queue-badge">🔴 ${dueCount} ta bugun</span>`
        :`<span class="sr-queue-badge" style="background:rgba(34,201,122,.1);color:var(--green)">✅ Hammasi ko'rilgan</span>`}
    </div>
    <div class="sr-stats-bar">

      <div class="sr-stat"><div class="sr-stat-v" style="color:var(--green)">${easyCount}</div><div class="sr-stat-l">Oson</div></div>

          <div style="font-family:'Instrument Serif',serif;font-size:20px;font-weight:700;color:#ecf2ff;margin-bottom:12px;font-style:italic">${esc(n.title)}</div>

// Chat ID: ikki uid ni sorted holda birlashtirish (maxfiy va bir xil bo'lishi uchun)
function getChatId(uid1, uid2) {

async function rMsg() {

let _chatsListener = null;

async function loadChatsList() {
  if (!_firebaseReady || !db || !currentGoogleUser) return;
  const myUid = currentGoogleUser.uid;

  // Eski listenerni o'chiramiz
  if (_chatsListener) {
    db.ref('chats').off('value', _chatsListener);
    _chatsListener = null;
  }

  _chatsListener = db.ref('chats').orderByChild('updatedAt').on('value', snap => {
    const list = document.getElementById('chats-list');
    if (!list) {
      // Sahifa o'zgardi — listenerni o'chiramiz
      if (_chatsListener) {
        db.ref('chats').off('value', _chatsListener);
        _chatsListener = null;
      }
      return;
    }

    let myChats = [];
    if (snap.exists()) {
      snap.forEach(child => {
        const chat = child.val();
        if (chat.members && chat.members[myUid]) {
          myChats.push({ id: child.key, ...chat });
        }
      });
      myChats.sort((a, b) => (b.updatedAt||0) - (a.updatedAt||0));
    }

    if (!myChats.length) {
      list.innerHTML = `
      <div style="text-align:center;padding:60px 20px">
        <div style="font-size:48px;margin-bottom:14px">📭</div>
        <div style="font-family:var(--serif);font-size:18px;font-style:italic;color:#4a6080;margin-bottom:8px">Hali xabar yo'q</div>
        <div style="font-size:13px;color:var(--dim)">Jamoat postlarida ✉️ Xabar tugmasini bosib suhbat boshlang</div>
      </div>`;
      return;
    }

    list.innerHTML = myChats.map(chat => {
      const otherUid = Object.keys(chat.members).find(u => u !== myUid) || '';
      const other = chat.members[otherUid] || {};
      const lastMsg = chat.lastMessage || '';
      const lastTs = chat.updatedAt ? timeAgoShort(chat.updatedAt) : '';
      const unread = chat.unread?.[myUid] || 0;
      const initials = (other.name||'?')[0].toUpperCase();
      const avatarHTML = other.photo
        ? `<img src="${esc(other.photo)}" style="width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid ${unread?'var(--accent)':'transparent'}"/>`
        : `<div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;border:2px solid ${unread?'var(--accent)':'transparent'}">${initials}</div>`;

      return `<div onclick="openChatRoom('${chat.id}','${otherUid}','${esc(other.name||'Anonim')}','${esc(other.photo||'')}')"
        style="display:flex;align-items:center;gap:13px;padding:14px 16px;border-radius:18px;border:1px solid ${unread?'rgba(61,127,255,.25)':'var(--border)'};margin-bottom:8px;cursor:pointer;transition:.18s;background:${unread?'rgba(61,127,255,.07)':'var(--card)'}"
        onmouseenter="this.style.borderColor='rgba(61,127,255,.35)';this.style.background='rgba(61,127,255,.08)'"
        onmouseleave="this.style.borderColor='${unread?'rgba(61,127,255,.25)':'var(--border)'}';this.style.background='${unread?'rgba(61,127,255,.07)':'var(--card)'}'">
        <div style="position:relative;flex-shrink:0">
          ${avatarHTML}
          ${unread ? `<div style="position:absolute;top:-4px;right:-4px;background:var(--red);border-radius:50%;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;border:2px solid var(--bg);padding:0 4px">${unread}</div>` : ''}
        </div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
            <div style="font-size:14px;font-weight:${unread?'800':'600'};color:#ecf2ff">${esc(other.name||'Anonim')}</div>
            <div style="font-size:11px;color:var(--dim);flex-shrink:0;margin-left:8px">${lastTs}</div>
          </div>
          <div style="font-size:12px;color:${unread?'var(--text)':'var(--muted)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:${unread?'600':'400'}">${esc(lastMsg) || '<i style="opacity:.5">Xabar yo\'q</i>'}</div>
        </div>
        <div style="font-size:18px;color:var(--muted);flex-shrink:0">›</div>
      </div>`;
    }).join('');
  });
}

function timeAgoShort(ts) {
  const d = Math.floor((Date.now()-ts)/1000);
  if(d<60) return 'hozir';
  if(d<3600) return Math.floor(d/60)+'d';
  if(d<86400) return Math.floor(d/3600)+'s';
  return new Date(ts).toLocaleDateString('uz-UZ',{day:'2-digit',month:'short'});
}

let _chatMsgRef = null;
let _chatMsgHandler = null;

function listenChatMsgs(chatId, otherUid, otherName, otherPhoto) {
  if (!_firebaseReady || !db) return;

  // Eski listenerni to'xtatamiz
  if (_chatMsgRef && _chatMsgHandler) {
    _chatMsgRef.off('value', _chatMsgHandler);
  }

  const myUid = currentGoogleUser.uid;
  const ref = db.ref(`messages/${chatId}`).orderByChild('ts').limitToLast(200);
  _chatMsgRef = ref;
  let isFirst = true;

  _chatMsgHandler = ref.on('value', snap => {
    const box = document.getElementById('chat-msgs');
    if (!box) {
      ref.off('value', _chatMsgHandler);
      return;
    }

    // Scroll pastda ekanini tekshiramiz
    const wasAtBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;

    let msgs = [];
    if (snap.exists()) {
      snap.forEach(c => msgs.push(c.val()));
      msgs.sort((a, b) => (a.ts||0) - (b.ts||0));
    }

    if (!msgs.length) {
      box.innerHTML = `<div style="text-align:center;padding:40px 20px">
        <div style="font-size:40px;margin-bottom:10px">👋</div>
        <div style="font-size:13px;color:var(--dim);line-height:1.7">Suhbatni boshlang!<br><span style="font-size:11px;opacity:.6">🔒 Xabarlar faqat siz ikkovingizga ko'rinadi</span></div>
      </div>`;
      return;
    }

    // Xabarlarni render qilamiz
    box.innerHTML = msgs.map((m, i) => {
      const isMe = m.senderUid === myUid;
      const time = new Date(m.ts).toLocaleTimeString('uz-UZ', {hour:'2-digit', minute:'2-digit'});
      // Sana belgisi (kun o'zgarganda)
      const prevMsg = msgs[i-1];
      const showDate = !prevMsg || new Date(m.ts).toDateString() !== new Date(prevMsg.ts).toDateString();
      const dateLabel = showDate ? `<div style="text-align:center;margin:10px 0 6px"><span style="background:rgba(255,255,255,.06);border-radius:20px;padding:3px 12px;font-size:10px;color:var(--muted)">${new Date(m.ts).toLocaleDateString('uz-UZ',{day:'2-digit',month:'short'})}</span></div>` : '';

      const avatarHTML = !isMe ? (otherPhoto
        ? `<img src="${esc(otherPhoto)}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;flex-shrink:0"/>`
        : `<div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0">${(otherName||'?')[0].toUpperCase()}</div>`)
        : '';

      return `${dateLabel}<div style="display:flex;flex-direction:${isMe?'row-reverse':'row'};align-items:flex-end;gap:7px;margin-bottom:4px">
        ${avatarHTML}
        <div style="max-width:75%;min-width:60px;background:${isMe?'linear-gradient(135deg,#3d7fff,#6c3fff)':'rgba(255,255,255,.06)'};border:1px solid ${isMe?'transparent':'rgba(255,255,255,.08)'};border-radius:${isMe?'18px 18px 4px 18px':'18px 18px 18px 4px'};padding:10px 13px;box-shadow:0 2px 10px rgba(0,0,0,.25)">
          <div style="font-size:13px;color:${isMe?'#fff':'var(--text)'};line-height:1.55;word-break:break-word;white-space:pre-wrap">${esc(m.text)}</div>
          <div style="font-size:10px;color:${isMe?'rgba(255,255,255,.55)':'var(--dim)'};margin-top:5px;text-align:right;display:flex;align-items:center;justify-content:flex-end;gap:3px">${time}${isMe?(m.read?'<span style="color:rgba(100,200,255,.8)">✓✓</span>':'<span style="opacity:.5">✓</span>')  :''}</div>
        </div>
      </div>`;
    }).join('');

    // Birinchi yuklanishda yoki pastda bo'lsa — scroll pastga
    if (isFirst || wasAtBottom) {
      box.scrollTop = box.scrollHeight;
      isFirst = false;
    }

    markChatRead(chatId);
  });
}

async function sendChatMsg() {
  const inp = document.getElementById('chat-inp');
  const text = inp?.value?.trim();
  if (!text || !_activeChatId || !currentGoogleUser || !_firebaseReady) return;

  // Darhol tozalaymiz — foydalanuvchi kutmasin
  inp.value = '';
  inp.style.height = 'auto';
  inp.focus();

  const myUid = currentGoogleUser.uid;
  const other = _activeOtherUser;
  const chatId = _activeChatId;
  const ts = Date.now();
  const msgId = 'msg_' + ts.toString(36) + Math.random().toString(36).slice(2, 8);

  const myInfo = {
    name: currentGoogleUser.displayName || currentProfile?.name || 'Anonim',
    photo: currentGoogleUser.photoURL || currentProfile?.customPhoto || ''
  };
  const otherInfo = {
    name: other.name || 'Anonim',
    photo: other.photo || ''
  };

  try {
    // 1) Avval chat metadata va members ni yozamiz (rules uchun zarur)
    const metaUpdates = {};
    metaUpdates[`chats/${chatId}/members/${myUid}`] = myInfo;
    metaUpdates[`chats/${chatId}/members/${other.uid}`] = otherInfo;
    metaUpdates[`chats/${chatId}/lastMessage`] = text.slice(0, 80);
    metaUpdates[`chats/${chatId}/updatedAt`] = ts;
    metaUpdates[`chats/${chatId}/unread/${other.uid}`] = firebase.database.ServerValue.increment(1);
    await db.ref().update(metaUpdates);

    // 2) Keyin xabarni yozamiz (members endi mavjud — rules o'tadi)
    await db.ref(`messages/${chatId}/${msgId}`).set({
      id: msgId,
      text,
      senderUid: myUid,
      senderName: myInfo.name,
      ts,
      read: false
    });

    updateMsgBadge();
  } catch(e) {
    console.error('sendChatMsg error:', e);
    // Xabar qaytaramiz — foydalanuvchi qayta yozishi uchun
    inp.value = text;
    toast('Xabar yuborilmadi: ' + (e.code || e.message), 'err');
  }
}

async function markChatRead(chatId) {
  if (!_firebaseReady || !db || !currentGoogleUser) return;
  try {
    await db.ref(`chats/${chatId}/unread/${currentGoogleUser.uid}`).set(0);
    // Mark messages as read
    const snap = await db.ref(`messages/${chatId}`).orderByChild('senderUid').get();
    if (snap.exists()) {
      const updates = {};
      snap.forEach(c => {
        const m = c.val();
        if (m.senderUid !== currentGoogleUser.uid && !m.read) {
          updates[`messages/${chatId}/${c.key}/read`] = true;
        }
      });
      if (Object.keys(updates).length) await db.ref().update(updates);
    }
    updateMsgBadge();
  } catch(e) {}
}

async function updateMsgBadge() {
  if (!_firebaseReady || !db || !currentGoogleUser) return;
  try {
    const snap = await db.ref('chats').get();
    let total = 0;
    if (snap.exists()) {
      snap.forEach(c => {
        const chat = c.val();
        if (chat.members?.[currentGoogleUser.uid]) {
          total += chat.unread?.[currentGoogleUser.uid] || 0;
        }
      });
    }
    ['msg-badge-d','msg-badge-m'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = total > 0 ? 'block' : 'none';
    });
  } catch(e) {}
}

function previewProfilePhoto(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { toast('Rasm 2MB dan kichik bo\'lsin', 'err'); return; }

  const reader = new FileReader();
  reader.onload = e => {
    const base64 = e.target.result;
    const preview = document.getElementById('pe-avatar-preview');
    if (preview) {
      preview.innerHTML = `<img src="${base64}" style="width:100%;height:100%;object-fit:cover" id="pe-avatar-img"/>`;
    }
    // Vaqtincha saqlash
    window._pendingPhotoBase64 = base64;
  };
  reader.readAsDataURL(file);
}

function removeProfilePhoto() {
  window._pendingPhotoBase64 = null;
  window._removePhoto = true;
  const preview = document.getElementById('pe-avatar-preview');
  const fn = (document.getElementById('pe-firstname')?.value||'U')[0].toUpperCase();
  if (preview) preview.innerHTML = `<span id="pe-avatar-initials">${fn}</span>`;
  toast('Rasm olib tashlandi (saqlang)');
}

function updateAvatarInitials() {
  const fn = document.getElementById('pe-firstname')?.value || 'U';
  const el = document.getElementById('pe-avatar-initials');
  if (el) el.textContent = fn[0].toUpperCase();
}

function saveProfileEdit() {
  const firstName = document.getElementById('pe-firstname')?.value?.trim();
  const lastName = document.getElementById('pe-lastname')?.value?.trim() || '';
  if (!firstName) { toast('Ism kiritilmadi', 'err'); return; }

  const phone = document.getElementById('pe-phone')?.value?.trim();
  const uni = document.getElementById('pe-uni')?.value?.trim();
  const year = document.getElementById('pe-year')?.value;
  const spec = document.getElementById('pe-spec')?.value?.trim();
  const bio = document.getElementById('pe-bio')?.value?.trim();
  const telegram = document.getElementById('pe-telegram')?.value?.trim();
  const instagram = document.getElementById('pe-instagram')?.value?.trim();

  const fullName = [firstName, lastName].filter(Boolean).join(' ');

  let customPhoto = currentProfile?.customPhoto || null;
  if (window._pendingPhotoBase64) {
    customPhoto = window._pendingPhotoBase64;
    window._pendingPhotoBase64 = null;
  }
  if (window._removePhoto) {
    customPhoto = null;
    window._removePhoto = false;
  }

  currentProfile = {
    ...(currentProfile || {}),
    firstName, lastName, name: fullName,
    phone: phone ? '+998' + phone.replace(/\s/g,'') : '',
    university: uni, year, speciality: spec,
    bio, telegram: telegram ? '@'+telegram : '',
    instagram: instagram ? '@'+instagram : '',
    customPhoto,
    joinDate: currentProfile?.joinDate || Date.now(),
    updatedAt: Date.now()
  };

  localStorage.setItem('nn4_profile', JSON.stringify(currentProfile));
  document.getElementById('profile-edit-overlay').style.display = 'none';
  toast('✅ Profil saqlandi!');
  rProfile();
}

function confirmClearAll() {
  if (!confirm("⚠️ Barcha konspektlar o'chib ketadi! Avval eksport qilishni tavsiya qilamiz.\n\nDavom etasizmi?")) return;
  if (!confirm("Rostdan ham o'chirasizmi? Bu qaytarib bo'lmaydi!")) return;
  notes = [];
  save();
  toast("Barcha ma'lumotlar o'chirildi", 'err');
  rProfile();
}

// ── EXPORT / IMPORT ───────────────────────────────────────────────
function exportData(){
  const b=new Blob([JSON.stringify({notes,customSubj,topicProg},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mednotepad_backup.json';a.click();
  toast('Eksport qilindi ⬇');
}
function importData(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(Array.isArray(d.notes)){notes=[...d.notes,...notes];if(d.customSubj)customSubj=[...new Set([...customSubj,...d.customSubj])];if(d.topicProg)topicProg={...d.topicProg,...topicProg};save();toast(d.notes.length+' ta yuklandi ⬆');rHome();}
      else if(Array.isArray(d)){notes=[...d,...notes];save();toast(d.length+' ta yuklandi ⬆');rHome();}
    }catch{toast('Format xato!','err');}
  };
  r.readAsText(f);e.target.value='';
}

let _srcMode = false;

function fmt(cmd, val){
  document.getElementById('rich-ed')?.focus();
  document.execCommand(cmd, false, val||null);
  onRichInput();
  updateToolbarState();
}

function fmtBlock(tag){
  if(!tag)return;
  document.getElementById('rich-ed')?.focus();
  document.execCommand('formatBlock', false, tag);
  onRichInput();
}

function fmtMark(){
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed)return;
  const range=sel.getRangeAt(0);
  const mark=document.createElement('mark');
  try{range.surroundContents(mark);}
  catch(e){document.execCommand('insertHTML',false,`<mark>${sel.toString()}</mark>`);}
  onRichInput();
}

function fmtCode(){
  const sel=window.getSelection();
  const txt=sel?.toString()||'';
  if(txt){
    document.execCommand('insertHTML',false,`<code>${txt.replace(/</g,'&lt;')}</code>`);
  } else {
    document.execCommand('insertHTML',false,`<code>kod</code>`);
  }
  onRichInput();
}

function fmtHR(){
  document.execCommand('insertHTML',false,'<hr/>');
  onRichInput();
}

function fmtTable(){
  const html=`<table><tr><th>Ustun 1</th><th>Ustun 2</th><th>Ustun 3</th></tr><tr><td>Ma'lumot</td><td>Ma'lumot</td><td>Ma'lumot</td></tr><tr><td></td><td></td><td></td></tr></table><p><br></p>`;
  document.execCommand('insertHTML',false,html);
  onRichInput();
}

function fmtLink(){
  const url=prompt("Havola URL si:", "https://");
  if(url){
    const sel=window.getSelection();
    const txt=sel?.toString()||'Havola';
    document.execCommand('insertHTML',false,`<a href="${url}" target="_blank">${txt}</a>`);
    onRichInput();
  }
}

function onRichInput(){
  if(_srcMode)return;
  const re=document.getElementById('rich-ed');
  if(!re)return;
  editing.content=re.innerHTML;
  onContentChange();
  upSt();
}

function onSrcInput(){
  const se=document.getElementById('src-ed');
  const re=document.getElementById('rich-ed');
  if(!se||!re)return;
  re.innerHTML=se.value;
  editing.content=se.value;
  onContentChange();
}

function toggleSrcMode(){
  _srcMode=!_srcMode;
  const re=document.getElementById('rich-ed');
  const se=document.getElementById('src-ed');
  const btn=document.getElementById('src-mode-btn');
  const tb=document.getElementById('fmt-toolbar');
  if(!re||!se)return;
  if(_srcMode){
    se.value=re.innerHTML;
    re.style.display='none';
    se.style.display='block';
    if(btn)btn.classList.add('active');
    // hide toolbar buttons except src mode btn
    if(tb)tb.querySelectorAll('.fmt-btn:not(#src-mode-btn),.fmt-sep,.fmt-select').forEach(el=>el.style.opacity='0.3');
  } else {
    re.innerHTML=se.value;
    editing.content=se.value;
    re.style.display='block';
    se.style.display='none';
    if(btn)btn.classList.remove('active');
    if(tb)tb.querySelectorAll('.fmt-btn:not(#src-mode-btn),.fmt-sep,.fmt-select').forEach(el=>el.style.opacity='1');
  }
}

function updateToolbarState(){
  const cmds=['bold','italic','underline','strikeThrough'];
  const labels=['B','I','U','S'];
  document.querySelectorAll('.fmt-toolbar .fmt-btn').forEach(btn=>{
    const txt=btn.querySelector('b,i,u,s')?.tagName?.toLowerCase();
    if(txt){
      const cmd=txt==='b'?'bold':txt==='i'?'italic':txt==='u'?'underline':'strikeThrough';
      btn.classList.toggle('active',document.queryCommandState(cmd));
    }
  });
}

function onRichKey(e){
  // Ctrl+S save
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveNote();return;}
  // Ctrl+B Bold
  if((e.ctrlKey||e.metaKey)&&e.key==='b'){e.preventDefault();fmt('bold');return;}
  // Ctrl+I Italic
  if((e.ctrlKey||e.metaKey)&&e.key==='i'){e.preventDefault();fmt('italic');return;}
  // Ctrl+U Underline
  if((e.ctrlKey||e.metaKey)&&e.key==='u'){e.preventDefault();fmt('underline');return;}
  // Tab -> indent
  if(e.key==='Tab'){
    e.preventDefault();
    document.execCommand('insertHTML',false,'&nbsp;&nbsp;&nbsp;&nbsp;');
  }
}

function getRichText(){
  const re=document.getElementById('rich-ed');
  return re?re.innerHTML:'';
}

function setRichText(html){
  const re=document.getElementById('rich-ed');
  if(re)re.innerHTML=html||'';
}

function go(v,arg){
  if(view==='editor'&&v!=='editor'){stopAutosave();clearInterval(window._draftTimer);}
  // Stop chat/chats listener when leaving msg view
  if(view==='msg' && v!=='msg'){
    if (_chatMsgRef && _chatMsgHandler) { _chatMsgRef.off('value', _chatMsgHandler); _chatMsgRef = null; _chatMsgHandler = null; }
    if (_chatsListener) { db?.ref('chats').off('value', _chatsListener); _chatsListener = null; }
    _activeChatId = null;
    _activeOtherUser = null;
  }
  // Update SR badge
  setTimeout(()=>{
    const cnt=srDueCount();
    ['sr-badge','sr-badge-m','sr-badge-d'].forEach(id=>{
      const el=document.getElementById(id);
      if(el)el.style.display=cnt>0?'block':'none';
    });
  },100);
  view=v;
  ['home','comm','neuro','flash','msg','stats','profile'].forEach(k=>{
    document.getElementById('nb-'+k)?.classList.toggle('on',k===v);
    document.getElementById('mb-'+k)?.classList.toggle('on',k===v);
  });
  // dynamic fan buttons
  document.querySelectorAll('[id^="nb-fan-"]').forEach(b=>b.classList.remove('on'));
  if(v==='fan' && arg){
    customSubj.forEach((s,i)=>{ if(getFanName(s)===arg) document.getElementById('nb-fan-'+i)?.classList.add('on'); });
  }
  if(v==='home')rHome();
  else if(v==='neuro')rNeuro();
  else if(v==='flash')rFlash();
  else if(v==='msg')rMsg();
  else if(v==='prog')rProg();
  else if(v==='stats')rStats();
  else if(v==='editor')rEditor();
  else if(v==='detail')rDetail(arg);
  else if(v==='fan')rFan(arg);
  else if(v==='comm')rComm();
  else if(v==='profile')rProfile();
  window.scrollTo(0,0);
}

async function confirmPublish(noteId) {
  const n = notes.find(x => x.id === noteId);
  if (!n) return;
  const author = document.getElementById('pub-author')?.value?.trim() || 'Anonim';
  const uni = document.getElementById('pub-uni')?.value?.trim() || '';
  const prog = document.getElementById('pub-prog');
  if (prog) prog.textContent = '⏳ Nashr qilinmoqda...';

  const div = document.createElement('div'); div.innerHTML = n.content||'';
  const plainText = div.innerText || div.textContent || '';

  const pubNote = {
    id: 'pub_' + uid(),
    sourceId: n.id,
    title: n.title || 'Nomsiz',
    content: n.content || '',
    plainText: plainText.slice(0, 500),
    subject: n.subject || 'Nevrologiya',
    color: n.color || '#5b8dee',
    tags: n.tags || [],
    images: (n.images || []).slice(0, 3),
    author,
    authorUid: currentGoogleUser?.uid || null,
    authorPhoto: currentGoogleUser?.photoURL || null,
    authorEmail: currentGoogleUser?.email || null,
    uni,
    avatar: author.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2),
    likes: 0,
    views: 0,
    commentsCount: 0,
    publishedAt: Date.now()
  };

  if (prog) prog.textContent = '⏳ Firebase ga yuklanmoqda...';

  // Save to Firebase + localStorage
  const existing = getCommunity();
  const filtered = existing.filter(x => x.sourceId !== noteId);
  saveCommunity([pubNote, ...filtered].slice(0, 300));

  // Firebase ga saqlash
  const dbOk = await saveToDB(pubNote);

  // Mark note as published
  const ni = notes.findIndex(x => x.id === noteId);
  if (ni >= 0) { notes[ni].isPublished = true; save(); }

  if (prog) prog.textContent = dbOk ? '✅ Barcha qurilmalarda korinadi!' : '✅ Saqlandi (offline)';
  setTimeout(async () => {
    (document.getElementById('pub-modal-overlay')||{style:{}}).style.display = 'none';
    toast(dbOk ? '🚀 Barcha qurilmalarda korinadi!' : '✅ Nashr qilindi');
    // Force refresh from Firebase
    if (dbOk) {
      const fresh = await getCommunityFromDB();
      saveCommunity(fresh);
    }
    if (view === 'comm') rComm();
  }, 700);
}

function setCommFilter(val, el) {

  el?.classList.add('on');

function renderCommList() {
  let list = getCommunity();
  if (_commFilter === 'hot') list = [...list].sort((a,b) => (b.likes||0)-(a.likes||0));
  else if (_commFilter === 'new') list = [...list].sort((a,b) => b.publishedAt-a.publishedAt);
  else if (_commFilter !== 'all') list = list.filter(n => n.subject === _commFilter);

  const el = document.getElementById('comm-list');
  if (!el) return;
  if (!list.length) {
    el.innerHTML = `<div style="text-align:center;padding:60px 16px">

// ── Like ───────────────────────────────────────────
function toggleCommLike(noteId) {
  const myLikes = getMyLikes();
  const comm = getCommunity();
  const ni = comm.findIndex(x => x.id === noteId);
  if (ni < 0) return;
  const liked = !!myLikes[noteId];
  if (liked) {
    delete myLikes[noteId];
    comm[ni].likes = Math.max((comm[ni].likes||0)-1, 0);
  } else {
    myLikes[noteId] = true;
    comm[ni].likes = (comm[ni].likes||0)+1;
  }
  saveMyLikes(myLikes);
  saveCommunity(comm);
  // Update button
  const btn = document.getElementById('cl-' + noteId);
  if (btn) {
    btn.classList.toggle('liked', !liked);
    btn.innerHTML = (!liked?'❤️':'🤍') + ' ' + comm[ni].likes;
  }
  if (!liked) toast('❤️ Like bosildi');
  // Sync to Firebase
  updateLikeInDB(noteId, comm[ni].likes);
}

// ── Ko'rishlar soni ────────────────────────────────
function incViews(noteId) {
  const comm = getCommunity();
  const ni = comm.findIndex(x => x.id === noteId);
  if (ni < 0) return;
  comm[ni].views = (comm[ni].views||0)+1;
  saveCommunity(comm);
  updateViewsInDB(noteId, comm[ni].views);
}

      onmouseenter="this.style.opacity='.88'" onmouseleave="this.style.opacity='1'">

    <button onclick="document.getElementById('author-popup')?.remove();go('comm')"

  // Smart positioning
  requestAnimationFrame(() => {
    const pw = pop.offsetWidth || 260;
    const ph = pop.offsetHeight || 180;
    const cx = event?.clientX ?? window.innerWidth / 2;
    const cy = event?.clientY ?? window.innerHeight / 2;
    let x = cx - pw / 2;
    let y = cy + 14;
    if (x + pw > window.innerWidth - 8) x = window.innerWidth - pw - 8;
    if (x < 8) x = 8;
    if (y + ph > window.innerHeight - 8) y = cy - ph - 14;

    }

  }, 120);
}

function addComment(noteId) {
  const inp = document.getElementById(`cmt-inp-${noteId}`);
  const text = inp?.value?.trim();
  if (!text) return;
  const author = currentProfile?.name || 'Anonim';
  const comment = { id: uid(), author, text, ts: Date.now() };
  const cmts = [...getComments(noteId), comment];
  saveComments(noteId, cmts);

  // Update commentsCount
  const comm = getCommunity();
  const ni = comm.findIndex(x=>x.id===noteId);
  if (ni>=0) { comm[ni].commentsCount = cmts.length; saveCommunity(comm); }

  // Save to Firebase
  saveCommentToDB(noteId, comment);

  inp.value = '';
  // Re-render comments
  const timeAgo = (ts) => {const d=Math.floor((Date.now()-ts)/1000);if(d<60)return 'Hozirgina';return Math.floor(d/60)+' daqiqa oldin';};
  const wrap = document.getElementById(`cmts-${noteId}`);
  if (wrap) {
    const newHtml = `<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#5b8dee,#7c5cbf);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0">${esc(author[0]?.toUpperCase()||'?')}</div>
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;font-weight:600;color:#ecf2ff;margin-bottom:2px">${esc(author)} <span style="color:var(--dim);font-weight:400">· Hozirgina</span></div>
        <div style="font-size:13px;color:#d0dff5;line-height:1.6">${esc(text)}</div>
      </div>
    </div>`;
    const noComments = wrap.querySelector('div[style*="text-align:center"]');
    if (noComments) wrap.innerHTML = '';
    wrap.innerHTML += newHtml;
  }
  // Update comment button in card
  const cBtn = document.querySelector(`#cc-${noteId} .comm-likes:nth-child(2)`);
  if (cBtn) cBtn.innerHTML = `💬 ${cmts.length} izoh`;
  toast('Izoh qoshildi 💬');
}

function saveCommToMine(noteId) {
  const n = getCommunity().find(x=>x.id===noteId);
  if (!n) return;
  const newNote = {
    id: uid(), title: n.title + ' (jamoat)',
    content: n.content||'', subject: n.subject||'Nevrologiya',
    color: n.color||'#5b8dee', tags: n.tags||[], images: n.images||[],
    pinned: false, starred: false, progress: 'new',

// 🃏 SPACED REPETITION ENGINE
// ══════════════════════════════════════════════════
let srData = JSON.parse(localStorage.getItem('nn4_sr') || '{}');

const SR_INTERVALS = { easy: 7, medium: 3, hard: 1 }; // kunlar

function srAnswer(noteId, ease) {
  const now = Date.now();
  const prev = srData[noteId] || {};
  const days = SR_INTERVALS[ease] || 1;
  // Adaptive interval: if easy again, double the interval
  let interval = days;
  if (ease === 'easy' && prev.ease === 'easy') {
    interval = Math.min((prev.interval || days) * 2, 60);
  }
  srData[noteId] = {
    ease,
    interval,
    nextReview: now + interval * 86400000,
    lastReview: now,
    reviewCount: (prev.reviewCount || 0) + 1
  };
  localStorage.setItem('nn4_sr', JSON.stringify(srData));
}

function srNextDate(ease) {
  const days = SR_INTERVALS[ease] || 1;
  const d = new Date(Date.now() + days * 86400000);
  return d.toLocaleDateString('uz-UZ', { day:'2-digit', month:'short' });
}

function srDueCount() {
  const now = Date.now();
  return notes.filter(n => n.title && n.content && (srData[n.id]?.nextReview || 0) <= now).length;
}

      </div>`:''}
    </div>`;

  wrap.prepend(progress);
  document.body.appendChild(wrap);
  document.body.style.overflow = 'hidden';

  // Render content
  setTimeout(() => {
    const el = document.getElementById('read-content');
    if (el) {
      const cnt = n.content || '';
      if (cnt.trim().startsWith('<') || cnt.includes('<p') || cnt.includes('<h'))
        el.innerHTML = cnt;
      else
        el.innerHTML = cnt.split('\n').map(l => l.trim() ? `<p>${l}</p>` : '<p><br></p>').join('');
    }
  }, 50);

  // Reading progress bar
  const inner = document.getElementById('read-inner');
  wrap.addEventListener('scroll', () => {
    const prog = document.getElementById('read-prog');
    if (!prog || !inner) return;
    const scrolled = wrap.scrollTop;
    const total = inner.scrollHeight - wrap.clientHeight;
    const pct = total > 0 ? Math.round(scrolled / total * 100) : 100;
    prog.style.width = pct + '%';
  });

  // Keyboard: ESC to close
  wrap._keyHandler = (e) => { if (e.key === 'Escape') closeReadMode(); };
  document.addEventListener('keydown', wrap._keyHandler);
}

function closeReadMode() {
  const wrap = document.getElementById('read-mode');
  if (wrap) {
    document.removeEventListener('keydown', wrap._keyHandler);
    wrap.remove();
  }
  document.body.style.overflow = '';
}

let _readFontSize = 16;
function changeFontSize(delta) {
  _readFontSize = Math.max(12, Math.min(24, _readFontSize + delta));
  const el = document.getElementById('read-content');
  if (el) el.style.fontSize = _readFontSize + 'px';
}

let _gSearchTimer = null;

function openGlobalSearch() {
  if (document.getElementById('gsearch-overlay')) return;
  const overlay = document.createElement('div');
  overlay.className = 'gsearch-overlay';
  overlay.id = 'gsearch-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) closeGlobalSearch(); };
  overlay.innerHTML = `
    <div class="gsearch-box">
      <input class="gsearch-inp" id="gs-inp" placeholder="Konspekt, mavzu, teg bo'yicha qidirish..." autocomplete="off"
        oninput="gsSearch(this.value)"
        onkeydown="gsKeyNav(event)"/>
      <div id="gs-results" style="max-height:60vh;overflow-y:auto"></div>
      <div style="padding:8px 16px;font-size:11px;color:var(--dim);border-top:1px solid var(--border);display:flex;gap:12px">
        <span>↑↓ Navigatsiya</span><span>Enter — Ochish</span><span>Esc — Yopish</span>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  setTimeout(() => document.getElementById('gs-inp')?.focus(), 50);
  document.addEventListener('keydown', _gsKeyClose);
  gsSearch('');
}

function _gsKeyClose(e) { if (e.key === 'Escape') closeGlobalSearch(); }

function closeGlobalSearch() {
  document.getElementById('gsearch-overlay')?.remove();
  document.removeEventListener('keydown', _gsKeyClose);
}

let _gsSelected = -1;

function gsSearch(q) {
  clearTimeout(_gSearchTimer);
  _gSearchTimer = setTimeout(() => {
    const res = document.getElementById('gs-results');
    if (!res) return;
    _gsSelected = -1;
    const query = q.toLowerCase().trim();

    // Search notes
    let matches = notes.filter(n => {
      if (!query) return true;
      const div = document.createElement('div'); div.innerHTML = n.content||'';
      const text = div.innerText || '';
      return (n.title||'').toLowerCase().includes(query) ||
             text.toLowerCase().includes(query) ||
             (n.subject||'').toLowerCase().includes(query) ||
             (n.tags||[]).some(t => t.toLowerCase().includes(query));
    }).slice(0, 12);

    // Also search Neuro topics
    const topicMatches = [];
    if (query) {
      NEURO.forEach(sec => {
        sec.topics.forEach(t => {
          if (t.name.toLowerCase().includes(query) || t.d.toLowerCase().includes(query)) {
            topicMatches.push({ ...t, section: sec.sec, color: sec.col });
          }
        });
      });
    }

    if (!matches.length && !topicMatches.length) {
      res.innerHTML = `<div style="padding:20px;text-align:center;color:var(--dim);font-size:13px">"${esc(q)}" bo'yicha hech narsa topilmadi</div>`;
      return;
    }

    function highlight(text, q) {
      if (!q) return esc(text);
      const idx = text.toLowerCase().indexOf(q.toLowerCase());
      if (idx < 0) return esc(text);
      return esc(text.slice(0, idx)) + `<span class="gsearch-hl">${esc(text.slice(idx, idx+q.length))}</span>` + esc(text.slice(idx+q.length));
    }

    let html = '';
    if (matches.length) {
      html += `<div style="padding:6px 16px 4px;font-size:10px;color:var(--dim);font-weight:700;letter-spacing:1px;text-transform:uppercase">📝 KONSPEKTLAR</div>`;
      html += matches.map(n => {
        const div = document.createElement('div'); div.innerHTML = n.content||'';
        const preview = (div.innerText||'').slice(0,80);
        return `<div class="gsearch-result" onclick="closeGlobalSearch();go('detail','${n.id}')">
          <div style="width:10px;height:10px;border-radius:50%;background:${n.color||'#5b8dee'};flex-shrink:0"></div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;color:#ecf2ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${highlight(n.title||'Nomsiz',q)}</div>
            <div style="font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(n.subject)} · ${preview}</div>
          </div>
          <span style="font-size:10px;color:var(--dim);flex-shrink:0">${fd(n.updatedAt)}</span>
        </div>`;
      }).join('');
    }

    if (topicMatches.length) {
      html += `<div style="padding:6px 16px 4px;font-size:10px;color:var(--dim);font-weight:700;letter-spacing:1px;text-transform:uppercase">🧠 NEVROLOGIYA MAVZULARI</div>`;
      html += topicMatches.slice(0, 5).map(t =>
        `<div class="gsearch-result" onclick="closeGlobalSearch();go('neuro')">
          <div style="font-size:16px;flex-shrink:0">🧠</div>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;color:#ecf2ff">${highlight(t.name,q)}</div>
            <div style="font-size:11px;color:var(--muted)">${esc(t.section)} · ${esc(t.d)}</div>
          </div>
          <span style="font-size:10px;color:${t.color};flex-shrink:0">Nevrologiya</span>
        </div>`
      ).join('');
    }

    res.innerHTML = html;
  }, 200);
}

function gsKeyNav(e) {
  const items = document.querySelectorAll('.gsearch-result');
  if (e.key === 'ArrowDown') { _gsSelected = Math.min(_gsSelected+1, items.length-1); }
  else if (e.key === 'ArrowUp') { _gsSelected = Math.max(_gsSelected-1, 0); }
  else if (e.key === 'Enter' && _gsSelected >= 0) { items[_gsSelected]?.click(); return; }
  else return;
  items.forEach((el,i) => { el.style.background = i===_gsSelected?'rgba(91,141,238,.12)':''; });
  items[_gsSelected]?.scrollIntoView({block:'nearest'});
}
